<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="theme-color" content="#f2f5f9"><title>Absensi • Ruang Guru</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="assets/css/ios-core.css"><script src="auth-guard.js"></script>
<style>
.att-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.att-stat{padding:11px;border-radius:15px;background:var(--input-bg);border:1px solid var(--card-border);text-align:center}.att-stat b{display:block;font-size:19px}.att-stat small{color:var(--muted-dark);font-size:10px}.session-card{padding:16px;border-radius:20px;margin-bottom:12px}.session-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.session-title{font-size:15px;font-weight:900}.session-meta{font-size:12px;color:var(--muted-dark);margin-top:5px}.att-list{margin-top:12px;display:grid;gap:7px}.att-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--input-bg);border:1px solid var(--card-border)}.att-row b{font-size:13px}.att-row small{display:block;color:var(--muted-dark);margin-top:2px;font-size:11px}.empty-mini{padding:12px;border-radius:14px;background:var(--input-bg);color:var(--muted-dark);font-size:12px}.session-card details summary{cursor:pointer;font-size:12px;font-weight:800;color:var(--accent);margin-top:12px}
@media(max-width:600px){.att-summary{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div class="ios-bg" aria-hidden="true"><div class="mesh-orb orb-1"></div><div class="mesh-orb orb-2"></div></div>
<header class="ios-navbar wrap ios-glass"><a class="back-btn" href="guru.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>Beranda</a><div class="nav-tools"><div class="theme-segmented"><select data-theme-select aria-label="Mode Tampilan"><option value="light">Light</option><option value="dark">Dark</option><option value="system">Sistem</option></select></div><button class="ios-btn danger" data-logout type="button">Keluar</button></div></header>
<main class="wrap"><section class="hero" style="padding-top:8px"><div class="ios-kicker"><span class="kicker-dot"></span><span>Absensi Pelajaran</span></div><h1 style="font-size:clamp(26px,5vw,38px)">Absensi & Data Kehadiran</h1><p>Pilih mata pelajaran untuk membuka sesi dan melihat data absensi siswa pada setiap sesi.</p></section>
<section class="section" style="padding-top:0"><div id="subjects" class="subject-row"><div class="empty">Memuat mata pelajaran...</div></div><div class="ios-panel ios-glass" style="margin-top:6px"><div class="two-col" style="align-items:end"><div class="field-group"><label>Durasi buka (menit)</label><input id="attMinutes" type="number" min="5" value="45" class="form-input"></div><button class="ios-btn primary" id="openAtt" type="button" style="padding:14px;justify-content:center">Buka Absensi Sekarang</button></div><div id="attStatus" class="toast"></div></div>
<h3 style="margin:22px 0 12px;font-size:16px;font-weight:800">Data Absensi per Sesi</h3><div id="attList" class="card-list"><div class="empty">Pilih mata pelajaran.</div></div></section></main>
<nav class="ios-tab-bar" style="--tabs:6"><a href="guru.html">Utama</a><a href="guru-tugas.html">Tugas</a><a href="guru-pengumuman.html">Info</a><a href="guru-materi.html">Materi</a><a href="guru-absensi.html">Absen</a><a href="guru-nilai.html">Nilai</a></nav><footer class="page-footer">XII TKJ 3 • SMK NU Bandar</footer>
<script src="assets/js/ios-core.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";import{getFirestore,collection,addDoc,onSnapshot,query,where,getDocs,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAv8Jm4XzYPh7xU-Pcy6QmAtbKiVLvuTnw",authDomain:"absensi-xii-tkj3.firebaseapp.com",projectId:"absensi-xii-tkj3",storageBucket:"absensi-xii-tkj3.firebasestorage.app",messagingSenderId:"219267949077",appId:"1:219267949077:web:8cf7d62f31ae1987a6641c"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const q=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const SUBJ_KEY='tkj3_guru_subject';const defaultGuruSubjects=["Administrasi Infrastruktur Jaringan","Administrasi Server","Teknologi Layanan Jaringan","Teknologi Jaringan Berbasis Luas (WAN)","Komputer dan Jaringan Dasar"];let uid='',teacher='',current='',unsubSessions=null,unsubAtt=null;
function renderSubjects(subjects){const stored=localStorage.getItem(SUBJ_KEY);current=(stored&&subjects.includes(stored))?stored:subjects[0];q('subjects').innerHTML=subjects.map(s=>`<button type="button" class="subject-chip ${s===current?'active':''}" data-sub="${esc(s)}">${esc(s)}</button>`).join('');q('subjects').querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{current=b.dataset.sub;localStorage.setItem(SUBJ_KEY,current);q('subjects').querySelectorAll('.subject-chip').forEach(c=>c.classList.toggle('active',c===b));loadAtt()});if(current)localStorage.setItem(SUBJ_KEY,current);loadAtt()}
async function loadAtt(){if(unsubSessions)unsubSessions();if(unsubAtt)unsubAtt();if(!current)return;q('attList').innerHTML='<div class="empty">Memuat data absensi...</div>';try{const [sessSnap,attSnap]=await Promise.all([getDocs(query(collection(db,'absensi_pelajaran'),where('mapel','==',current))),getDocs(query(collection(db,'kehadiran_pelajaran'),where('mapel','==',current)))]);const sessions=sessSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));const records=attSnap.docs.map(d=>({id:d.id,...d.data()}));if(!sessions.length){q('attList').innerHTML='<div class="empty">Belum ada sesi absensi untuk mapel ini.</div>';return}q('attList').innerHTML=sessions.map(x=>{const rows=records.filter(r=>r.sessionId===x.id).sort((a,b)=>(a.nama||'').localeCompare(b.nama||''));const counts={HADIR:0,IZIN:0,SAKIT:0,ALPA:0};rows.forEach(r=>counts[r.status]=(counts[r.status]||0)+1);const closed=Date.now()>(x.tutupAt||0);return `<article class="session-card ios-glass"><div class="session-head"><div><div class="session-title">${esc(x.mapel)}</div><div class="session-meta">${esc(x.tanggal||'-')} • Dibuka ${x.dibukaAt?new Date(x.dibukaAt).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'-'} • Tutup ${x.tutupAt?new Date(x.tutupAt).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'-'}</div></div><span class="ios-pill ${closed?'':'blue'}">${closed?'Ditutup':'Sedang Buka'}</span></div><div class="att-summary"><div class="att-stat"><b>${counts.HADIR||0}</b><small>Hadir</small></div><div class="att-stat"><b>${counts.IZIN||0}</b><small>Izin</small></div><div class="att-stat"><b>${counts.SAKIT||0}</b><small>Sakit</small></div><div class="att-stat"><b>${rows.length}</b><small>Total</small></div></div><details><summary>Lihat data siswa (${rows.length})</summary><div class="att-list">${rows.length?rows.map(r=>`<div class="att-row"><div><b>${esc(r.nama)}</b><small>${esc(r.username||'')} • ${esc(r.waktu||'-')}</small></div><span class="ios-pill ${r.status==='HADIR'?'':'blue'}">${esc(r.status)}</span></div>`).join(''):'<div class="empty-mini">Belum ada siswa yang mengisi sesi ini.</div>'}</div></details></article>`}).join('')}catch(e){console.error(e);q('attList').innerHTML='<div class="empty">Gagal membaca data absensi. Pastikan Rules Firestore sudah diperbarui.</div>'}}
async function loadTeacherSubjects(teacherUid,teacherSubjects){try{const uSnap=await getDoc(doc(db,'users',teacherUid||'guru-andi'));if(uSnap.exists()){const d=uSnap.data();if(d.nama)teacher=d.nama;if(Array.isArray(d.mataPelajaran)&&d.mataPelajaran.length)teacherSubjects=d.mataPelajaran}}catch(e){console.warn(e)}renderSubjects((teacherSubjects&&teacherSubjects.length)?teacherSubjects:defaultGuruSubjects)}
const rawSession=sessionStorage.getItem('tkj3_session');if(rawSession){try{const parsed=JSON.parse(rawSession);if(parsed.role==='guru'){uid=parsed.username||'guru-andi';teacher=parsed.nama||parsed.username||'Guru';loadTeacherSubjects(uid,defaultGuruSubjects)}}catch(e){console.error(e)}}
onAuthStateChanged(auth,async user=>{if(user){uid=user.uid;try{const u=await getDoc(doc(db,'users',uid));if(u.exists()&&u.data().role==='guru'){const d=u.data();teacher=d.nama||user.email;loadTeacherSubjects(uid,d.mataPelajaran||d.subjects||defaultGuruSubjects)}}catch(e){console.warn(e)}}});
q('openAtt').onclick=async()=>{if(!current)return;const minutes=Math.max(5,Number(q('attMinutes').value)||45),now=Date.now();try{await addDoc(collection(db,'absensi_pelajaran'),{mapel:current,guruUid:uid,guru:teacher,tanggal:new Date().toISOString().slice(0,10),dibukaAt:now,tutupAt:now+minutes*60000,status:'open',createdAt:now});q('attStatus').textContent='Absensi '+current+' dibuka selama '+minutes+' menit.';q('attStatus').className='toast';loadAtt()}catch(e){q('attStatus').textContent='Gagal membuka absensi: '+(e.message||e);q('attStatus').className='toast err'}};
</script></body></html>

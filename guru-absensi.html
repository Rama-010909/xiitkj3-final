<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="theme-color" content="#f2f5f9"><title>Absensi • Ruang Guru</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="assets/css/ios-core.css"><script src="auth-guard.js"></script>
<style>
.current-box{padding:16px 18px;border-radius:20px;margin-top:12px}.current-box b{display:block;font-size:18px;margin-top:4px}.current-box small{color:var(--muted-dark)}
.subject-card{padding:16px;border-radius:20px;margin-bottom:12px}.subject-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.subject-title{font-size:16px;font-weight:900}.subject-meta{font-size:12px;color:var(--muted-dark);margin-top:5px}.att-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.att-stat{padding:11px;border-radius:15px;background:var(--input-bg);border:1px solid var(--card-border);text-align:center}.att-stat b{display:block;font-size:19px}.att-stat small{color:var(--muted-dark);font-size:10px}.att-list{margin-top:12px;display:grid;gap:7px}.att-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--input-bg);border:1px solid var(--card-border)}.att-row b{font-size:13px}.att-row small{display:block;color:var(--muted-dark);margin-top:2px;font-size:11px}.empty-mini{padding:12px;border-radius:14px;background:var(--input-bg);color:var(--muted-dark);font-size:12px}.notif{position:fixed;right:18px;bottom:22px;z-index:1000;max-width:min(92vw,360px);padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--card-border);box-shadow:var(--shadow-ios-lg);backdrop-filter:blur(24px);transform:translateY(130%);transition:.3s}.notif.show{transform:translateY(0)}.notif b{display:block;font-size:13px}.notif small{display:block;color:var(--muted-dark);margin-top:3px}
@media(max-width:600px){.att-summary{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div class="ios-bg" aria-hidden="true"><div class="mesh-orb orb-1"></div><div class="mesh-orb orb-2"></div></div>
<header class="ios-navbar wrap ios-glass"><a class="back-btn" href="guru.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>Beranda</a><div class="nav-tools"><div class="theme-segmented"><select data-theme-select aria-label="Mode Tampilan"><option value="light">Light</option><option value="dark">Dark</option><option value="system">Sistem</option></select></div><button class="ios-btn danger" data-logout type="button">Keluar</button></div></header>
<main class="wrap"><section class="hero" style="padding-top:8px"><div class="ios-kicker"><span class="kicker-dot"></span><span>Absensi Pelajaran</span></div><h1 style="font-size:clamp(26px,5vw,38px)">Absensi & Data Kehadiran</h1><p>Data absensi otomatis mengikuti jam pelajaran. Tidak perlu membuka sesi secara manual.</p><div id="currentLesson" class="current-box ios-glass"><small>Jadwal saat ini</small><b>Memeriksa...</b></div></section>
<section class="section" style="padding-top:0"><h3 style="margin:0 0 12px;font-size:16px;font-weight:800">Mapel yang Diampu</h3><div id="subjects"><div class="empty">Memuat mata pelajaran...</div></div></section></main>
<div id="notif" class="notif" role="status"></div>
<nav class="ios-tab-bar" style="--tabs:6"><a href="guru.html">Utama</a><a href="guru-tugas.html">Tugas</a><a href="guru-pengumuman.html">Info</a><a href="guru-materi.html">Materi</a><a href="guru-absensi.html">Absen</a><a href="guru-nilai.html">Nilai</a></nav><footer class="page-footer">XII TKJ 3 • Guru</footer>
<script src="assets/js/ios-core.js"></script><script src="assets/js/schedule-utils.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import{getFirestore,collection,getDocs,query,where,doc,getDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAv8Jm4XzYPh7xU-Pcy6QmAtbKiVLvuTnw",authDomain:"absensi-xii-tkj3.firebaseapp.com",projectId:"absensi-xii-tkj3",storageBucket:"absensi-xii-tkj3.firebasestorage.app",messagingSenderId:"219267949077",appId:"1:219267949077:web:8cf7d62f31ae1987a6641c"};
const db=getFirestore(initializeApp(firebaseConfig));const q=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const defaults=["Administrasi Infrastruktur Jaringan","Administrasi Server","Teknologi Layanan Jaringan","Teknologi Jaringan Berbasis Luas (WAN)","Komputer dan Jaringan Dasar"];let teacher='',username='',subjects=[];let firstSnapshot=true;
function localDate(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
async function todaySchedule(){const snap=await getDocs(collection(db,'jadwal'));const today=TKJ3Schedule.dayName();for(const ds of snap.docs){const x=TKJ3Schedule.entriesFromDoc(ds);if(x.day===today)return x.entries}return []}
async function refreshCurrent(){try{const cur=TKJ3Schedule.currentEntry(await todaySchedule());const box=q('currentLesson');if(cur&&cur.break)box.innerHTML=`<small>${TKJ3Schedule.dayName()} • ${cur.jam}</small><b>Istirahat</b><span class="subject-meta">Absensi mapel ditutup.</span>`;else if(cur)box.innerHTML=`<small>${TKJ3Schedule.dayName()} • ${cur.jam}</small><b>${esc(cur.mapel)}</b><span class="subject-meta">Sedang berlangsung • absensi siswa dibuka otomatis</span>`;else box.innerHTML=`<small>${TKJ3Schedule.dayName()}</small><b>Tidak ada pelajaran yang sedang berlangsung</b><span class="subject-meta">Tidak ada absensi mapel yang dibuka.</span>`}catch(e){q('currentLesson').innerHTML='<small>Jadwal</small><b>Belum tersedia</b>'}}
async function loadTeacher(){const raw=sessionStorage.getItem('tkj3_session');if(raw){try{const x=JSON.parse(raw);teacher=x.nama||x.username||'Guru';username=x.username||'';const u=await getDoc(doc(db,'users',username));if(u.exists()){const d=u.data();teacher=d.nama||teacher;subjects=Array.isArray(d.mataPelajaran)&&d.mataPelajaran.length?d.mataPelajaran:defaults}}catch(e){console.warn(e)}}if(!subjects.length)subjects=defaults;renderAll();}
function showNotif(title,detail){const n=q('notif');n.innerHTML=`<b>${esc(title)}</b><small>${esc(detail)}</small>`;n.classList.add('show');clearTimeout(window.__nt);window.__nt=setTimeout(()=>n.classList.remove('show'),5000);if('Notification'in window&&Notification.permission==='granted')new Notification(title,{body:detail})}
function renderAll(){q('subjects').innerHTML=subjects.map(s=>`<article class="subject-card ios-glass" data-subject-card="${esc(s)}"><div class="subject-head"><div><div class="subject-title">${esc(s)}</div><div class="subject-meta">Data kehadiran siswa</div></div><span class="ios-pill">Memuat</span></div><div class="att-summary"><div class="att-stat"><b data-c="HADIR">0</b><small>Hadir</small></div><div class="att-stat"><b data-c="IZIN">0</b><small>Izin</small></div><div class="att-stat"><b data-c="SAKIT">0</b><small>Sakit</small></div><div class="att-stat"><b data-c="ALPA">0</b><small>Alpa</small></div></div><details style="margin-top:12px"><summary style="cursor:pointer;font-size:12px;font-weight:800;color:var(--accent)">Lihat data siswa</summary><div class="att-list" data-list><div class="empty-mini">Memuat...</div></div></details></article>`).join('');subjects.forEach(loadSubject)}
async function loadSubject(subject){try{const snap=await getDocs(query(collection(db,'kehadiran_pelajaran'),where('mapel','==',subject)));const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));const today=localDate();const todays=rows.filter(r=>r.tanggal===today);const card=[...document.querySelectorAll('[data-subject-card]')].find(x=>x.dataset.subjectCard===subject);if(!card)return;['HADIR','IZIN','SAKIT','ALPA'].forEach(st=>card.querySelector(`[data-c="${st}"]`).textContent=todays.filter(r=>r.status===st).length);card.querySelector('.ios-pill').textContent=todays.length+' absen hari ini';card.querySelector('[data-list]').innerHTML=rows.length?rows.slice(0,50).map(r=>`<div class="att-row"><div><b>${esc(r.nama)}</b><small>${esc(r.tanggal||'-')} • ${esc(r.waktu||'-')} • ${esc(r.username||'')}</small></div><span class="ios-pill ${r.status==='HADIR'?'':'blue'}">${esc(r.status)}</span></div>`).join(''):'<div class="empty-mini">Belum ada data absensi untuk mapel ini.</div>'}catch(e){console.error(e)}}
function listenNotifications(){onSnapshot(collection(db,'kehadiran_pelajaran'),snap=>{if(firstSnapshot){firstSnapshot=false;return}const added=snap.docChanges().filter(c=>c.type==='added').map(c=>c.doc.data()).filter(x=>subjects.includes(x.mapel));if(added.length){const x=added[added.length-1];showNotif('Ada siswa yang absen',`${x.nama||'Siswa'} • ${x.mapel||'-'} • ${x.status||'HADIR'} • ${x.waktu||''}`);added.forEach(x=>{if(subjects.includes(x.mapel))loadSubject(x.mapel)})}})}
if('Notification'in window)Notification.requestPermission().catch(()=>{});
refreshCurrent();setInterval(refreshCurrent,30000);loadTeacher().then(listenNotifications);
</script></body></html>

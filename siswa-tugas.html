<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f2f5f9">
<title>Tugas • Ruang Siswa</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="assets/css/ios-core.css">
<script src="auth-guard.js"></script>
</head>
<body>
<div class="ios-bg" aria-hidden="true"><div class="mesh-orb orb-1"></div><div class="mesh-orb orb-2"></div></div>

<header class="ios-navbar wrap ios-glass">
  <a class="back-btn" href="siswa.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>Beranda</a>
  <div class="nav-tools">
    <div class="theme-segmented"><select data-theme-select aria-label="Mode Tampilan"><option value="light">Light</option><option value="dark">Dark</option><option value="system">Sistem</option></select></div>
    <button class="ios-btn danger" data-logout type="button">Keluar</button>
  </div>
</header>

<main class="wrap">
  <section class="hero" style="padding-top:8px">
    <div class="ios-kicker"><span class="kicker-dot"></span><span>Tugas</span></div>
    <h1 style="font-size:clamp(26px,5vw,38px)">Tugas & Pengumpulan</h1>
    <p>Kerjakan tugas yang diberikan guru dan kumpulkan tepat waktu.</p>
  </section>

  <section class="section" style="padding-top:0">
    <div class="two-col">
      <div>
        <h3 style="margin:0 0 12px;font-size:16px;font-weight:800">Daftar Tugas Guru</h3>
        <div id="taskList" class="card-list"><div class="empty">Belum ada tugas yang dimuat.</div></div>
      </div>
      <div>
        <h3 style="margin:0 0 12px;font-size:16px;font-weight:800">Kumpulkan Tugas</h3>
        <div class="ios-panel ios-glass">
          <form id="submissionForm" class="form-grid" onsubmit="return false;">
            <div class="field-group">
              <label for="subMapel">Mata Pelajaran / Tugas</label>
              <select id="subMapel" class="form-select" required><option value="">Pilih tugas / mata pelajaran...</option></select>
            </div>
            <div class="field-group">
              <label>Nama Siswa</label>
              <div class="account-name-card"><span class="account-name-avatar"></span><span><small>Login sebagai</small><b id="submissionStudentName">Siswa</b></span></div>
            </div>
            <div class="field-group">
              <label for="subJawaban">Jawaban / Catatan</label>
              <textarea id="subJawaban" class="form-textarea" placeholder="Tulis ringkasan atau jawaban tugas di sini..."></textarea>
            </div>
            <div class="field-group">
              <label for="subLink">Link Tugas (opsional)</label>
              <input id="subLink" class="form-input" placeholder="https://drive.google.com/..." type="url">
            </div>
            <div class="field-group">
              <label for="subPhoto">Foto Tugas (opsional)</label>
              <input id="subPhoto" class="form-input" type="file" accept="image/jpeg,image/png,image/webp">
              <small style="display:block;color:var(--muted-dark);margin-top:6px">JPG, PNG, atau WebP • maksimal 5 MB</small>
              <div id="photoPreview" style="display:none;margin-top:10px"><img id="photoPreviewImg" alt="Pratinjau foto tugas" style="width:100%;max-height:220px;object-fit:contain;border-radius:16px;background:var(--input-bg)"></div>
            </div>
            <button id="submitTaskBtn" class="ios-btn primary" type="submit" style="padding:14px;justify-content:center;font-size:14px">Kirim Pengumpulan Tugas</button>
            <div id="subToast" class="toast"></div>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>

<nav class="ios-tab-bar" style="--tabs:6" aria-label="Navigasi Mobile Siswa">
  <a href="siswa.html">Utama</a>
  <a href="siswa-absensi.html">Absen</a>
  <a href="siswa-tugas.html">Tugas</a>
  <a href="siswa-materi.html">Materi</a>
  <a href="siswa-jadwal.html">Jadwal</a>
  <a href="siswa-galeri.html">Galeri</a>
</nav>
<footer class="page-footer">XII TKJ 3 • SMK NU Bandar</footer>

<script src="assets/js/ios-core.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAv8Jm4XzYPh7xU-Pcy6QmAtbKiVLvuTnw",
  authDomain: "absensi-xii-tkj3.firebaseapp.com",
  projectId: "absensi-xii-tkj3",
  storageBucket: "absensi-xii-tkj3.firebasestorage.app",
  messagingSenderId: "219267949077",
  appId: "1:219267949077:web:8cf7d62f31ae1987a6641c"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);
const q = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

const rawSession = sessionStorage.getItem("tkj3_session");
const userSession = rawSession ? JSON.parse(rawSession) : { nama: "Siswa", username: "siswa" };
const studentName = userSession.nama || userSession.username || "Siswa";
q('submissionStudentName').textContent = studentName;

let activeTasks = [];
onSnapshot(query(collection(db, "tugas"), orderBy("createdAt", "desc")), snap => {
  activeTasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const taskList = q('taskList'), subMapel = q('subMapel');
  if (!activeTasks.length) { taskList.innerHTML = '<div class="empty">Belum ada tugas dari guru.</div>'; subMapel.innerHTML = '<option value="">Tidak ada tugas aktif</option>'; return; }
  taskList.innerHTML = activeTasks.map(t => `
    <article class="item-card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="ios-pill blue">${esc(t.mapel || 'Tugas')}</span>
        <small style="color:var(--muted-dark)">${t.createdAt ? new Date(t.createdAt).toLocaleDateString('id-ID') : ''}</small>
      </div>
      <h3 style="margin-top:8px">${esc(t.judul)}</h3>
      <p style="color:var(--muted-dark);font-size:13.5px;margin:0 0 10px;line-height:1.5">${esc(t.deskripsi || '-')}</p>
      <div class="item-meta">
        <span>Deadline: <b>${esc(t.deadline ? new Date(t.deadline).toLocaleString('id-ID') : 'Tidak ditentukan')}</b></span>
        ${t.guru ? `<span>• Guru: ${esc(t.guru)}</span>` : ''}
        ${t.fileUrl ? `<a href="${esc(t.fileUrl)}" target="_blank" rel="noopener" class="ios-btn" style="padding:4px 10px;font-size:11px;margin-left:auto">Unduh Lampiran</a>` : ''}${t.attachmentUrl ? `<a href="${esc(t.attachmentUrl)}" target="_blank" rel="noopener" class="ios-btn" style="padding:4px 10px;font-size:11px">${t.attachmentName?'Buka '+esc(t.attachmentName):'Buka Lampiran'}</a>` : ''}
      </div>
    </article>
  `).join('');
  subMapel.innerHTML = '<option value="">Pilih tugas...</option>' + activeTasks.map(t => `<option value="${esc(t.id)}">${esc(t.mapel)}: ${esc(t.judul)}</option>`).join('');
});

q('subPhoto')?.addEventListener('change', e => {
  const file = e.target.files?.[0], preview = q('photoPreview'), img = q('photoPreviewImg');
  if (!file) { if(preview) preview.style.display='none'; return; }
  if (file.size > 5 * 1024 * 1024) { e.target.value=''; if(preview) preview.style.display='none'; q('subToast').textContent='Foto maksimal 5 MB.'; q('subToast').className='toast err'; return; }
  if(img && preview){ img.src=URL.createObjectURL(file); preview.style.display='block'; }
});
q('submitTaskBtn').addEventListener('click', async () => {
  const taskId = q('subMapel').value;
  const task = activeTasks.find(t=>t.id===taskId);
  const mapel = task?.mapel || '';
  const judulTugas = task?.judul || '';
  const siswa = studentName;
  const jawaban = q('subJawaban').value.trim();
  const link = q('subLink').value.trim();
  const photo = q('subPhoto')?.files?.[0] || null;
  const toast = q('subToast');
  if (!task) { toast.textContent = "Pilih tugas terlebih dahulu."; toast.className = "toast err"; return; }
  if (!jawaban && !link && !photo) { toast.textContent = "Isi jawaban, link, atau kirim foto tugas."; toast.className = "toast err"; return; }
  if (photo && photo.size > 5 * 1024 * 1024) { toast.textContent = "Foto maksimal 5 MB."; toast.className = "toast err"; return; }
  q('submitTaskBtn').disabled = true; toast.textContent = "Mengirim tugas..."; toast.className = "toast";
  try {
    let photoUrl = '';
    if (photo) {
      const safe = (studentName||'siswa').replace(/[^a-z0-9_-]/gi,'_');
      const path = `pengumpulan_tugas/${safe}/${Date.now()}_${photo.name.replace(/[^a-z0-9._-]/gi,'_')}`;
      const storageRef = ref(storage, path);
      await uploadBytes(storageRef, photo, { contentType: photo.type });
      photoUrl = await getDownloadURL(storageRef);
    }
    await addDoc(collection(db, "pengumpulan_tugas"), { taskId, judulTugas, mapel, siswa, username: session.username||studentName, jawaban, link, photoUrl, updatedAt: Date.now() });
    toast.textContent = "Tugas berhasil dikumpulkan."; toast.className = "toast";
    q('subJawaban').value=''; q('subLink').value=''; if(q('subPhoto')) q('subPhoto').value=''; if(q('photoPreview')) q('photoPreview').style.display='none';
  } catch (e) {
    console.error("Submit task:", e);
    const msg = e?.code === 'storage/unauthorized' ? 'Foto tidak dapat diupload. Periksa Firebase Storage Rules.' : (e.message || e);
    toast.textContent = "Gagal mengirim tugas: " + msg; toast.className = "toast err";
  } finally { q('submitTaskBtn').disabled=false; }
});

if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
</script>
</body>
</html>

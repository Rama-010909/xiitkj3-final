<main class="wrap">
  <section class="hero" style="padding-top:8px">

  <section class="section" style="padding-top:0">
    <div id="subjects" class="subject-row"><span class="subject-chip active" id="accountSubject">Memuat mapel akun...</span></div>

            <div class="field-group"><label>Lampiran URL</label><input id="taskFile" class="form-input" placeholder="https://..."></div>

        </div>
      </div>
      <div>
        <h3 style="margin:0 0 12px;font-size:16px;font-weight:800">Tugas Aktif</h3>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, where, doc, getDoc, getDocs, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAv8Jm4XzYPh7xU-Pcy6QmAtbKiVLvuTnw", authDomain: "absensi-xii-tkj3.firebaseapp.com", projectId: "absensi-xii-tkj3", storageBucket: "absensi-xii-tkj3.firebasestorage.app", messagingSenderId: "219267949077", appId: "1:219267949077:web:8cf7d62f31ae1987a6641c" };
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app); const q=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function uploadBlob(path,file,onProgress){const mod=await import('https://cdn.jsdelivr.net/npm/@vercel/blob@2.6.1/+esm');return mod.upload(path,file,{access:'public',handleUploadUrl:'/api/task-upload',multipart:file.size>4*1024*1024,onUploadProgress:e=>onProgress&&onProgress(Math.round(e.percentage||0))})}
const defaultGuruSubjects=["Administrasi Infrastruktur Jaringan","Administrasi Server","Teknologi Layanan Jaringan","Teknologi Jaringan Berbasis Luas (WAN)","Komputer dan Jaringan Dasar"]; let uid='',teacher='',current='',unsub=null,editingTaskId='';
function setAccountSubject(v){current=String(v||'').trim();q('accountSubject').textContent=current||'Mapel akun belum diatur';if(!current){q('taskList').innerHTML='<div class=\"empty\">Mapel akun guru belum diatur.</div>';return}loadTasks()}
async function initTeacher(id){try{const u=await getDoc(doc(db,'users',id||'guru-andi'));if(u.exists()){const d=u.data();teacher=d.nama||teacher;let m=d.mataPelajaran??d.mapel??d.subject;if(Array.isArray(m))m=m[0];if(!m&&Array.isArray(d.subjects))m=d.subjects[0];if(m)setAccountSubject(m);else setAccountSubject('')}}catch(e){setAccountSubject('')}}
const raw=sessionStorage.getItem('tkj3_session');if(raw)try{const p=JSON.parse(raw);if(p.role==='guru'){uid=p.username||'guru-andi';teacher=p.nama||p.username||'Guru';initTeacher(uid)}}catch(e){}
onAuthStateChanged(auth,async user=>{if(user){uid=user.uid;try{const u=await getDoc(doc(db,'users',uid));if(u.exists()&&u.data().role==='guru'){const d=u.data();teacher=d.nama||user.email;let m=d.mataPelajaran??d.mapel??d.subject;if(Array.isArray(m))m=m[0];if(!m&&Array.isArray(d.subjects))m=d.subjects[0];setAccountSubject(m||'')}}catch(e){}}});
q('saveTask').onclick=async()=>{if(!current)return;const title=q('taskTitle').value.trim(),desc=q('taskDesc').value.trim(),deadline=q('taskDeadline').value,fileUrl=q('taskFile').value.trim(),photo=q('taskPhoto')?.files?.[0]||null;if(!title){alert('Judul tugas wajib diisi.');return}if(photo&&photo.size>10*1024*1024){alert('Foto/PDF maksimal 10 MB.');return}q('saveTask').disabled=true;try{let attachmentUrl='',attachmentName='';if(photo){const safe=(teacher||uid||'guru').replace(/[^a-z0-9_-]/gi,'_'),filename=photo.name.replace(/[^a-z0-9._-]/gi,'_');const blob=await uploadBlob(`tugas/${safe}/${Date.now()}_${filename}`,photo,pct=>q('saveTask').textContent=`Mengunggah ${pct}%...`);attachmentUrl=blob.url;attachmentName=photo.name}if(editingTaskId){const old=await getDoc(doc(db,'tugas',editingTaskId));const oldData=old.exists()?old.data():{};await updateDoc(doc(db,'tugas',editingTaskId),{judul:title,deskripsi:desc,deadline,fileUrl,attachmentUrl:attachmentUrl||oldData.attachmentUrl||'',attachmentName:attachmentName||oldData.attachmentName||'',mapel:current,guruUid:uid,guru:teacher,updatedAt:Date.now()});alert('Tugas berhasil diperbarui.')}else{await addDoc(collection(db,'tugas'),{judul:title,deskripsi:desc,deadline,fileUrl,attachmentUrl,attachmentName,mapel:current,guruUid:uid,guru:teacher,createdAt:Date.now()});alert('Tugas berhasil diterbitkan dan akan muncul di akun siswa.')}resetForm()}catch(e){alert('Tugas gagal disimpan: '+(e.message||e))}finally{q('saveTask').disabled=false;if(!editingTaskId)q('saveTask').textContent='Terbitkan Tugas';}};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>

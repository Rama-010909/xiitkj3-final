<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f2f5f9">
<title>Tugas • Ruang Guru</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="assets/css/ios-core.css">
<script src="auth-guard.js"></script>
</head>
<body>
<div class="ios-bg" aria-hidden="true"><div class="mesh-orb orb-1"></div><div class="mesh-orb orb-2"></div></div>

<header class="ios-navbar wrap ios-glass">
  <a class="back-btn" href="guru.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>Beranda</a>
  <div class="nav-tools">
    <div class="theme-segmented"><select data-theme-select aria-label="Mode Tampilan"><option value="light">Light</option><option value="dark">Dark</option><option value="system">Sistem</option></select></div>
    <button class="ios-btn danger" data-logout type="button">Keluar</button>
  </div>
</header>

<main class="wrap">
  <section class="hero" style="padding-top:8px">
    <div class="ios-kicker"><span class="kicker-dot"></span><span>Tugas</span></div>
    <h1 style="font-size:clamp(26px,5vw,38px)">Kelola Tugas</h1>
    <p>Terbitkan tugas untuk mata pelajaran yang sedang dipilih.</p>
  </section>

  <section class="section" style="padding-top:0">
    <div id="subjects" class="subject-row"><div class="empty">Memuat mata pelajaran...</div></div>
    <div class="two-col" style="margin-top:6px">
      <div class="ios-panel ios-glass">
        <h3 style="margin:0 0 12px;font-size:16px;font-weight:800">Terbitkan Tugas Baru</h3>
        <div class="form-grid">
          <div class="field-group"><label>Judul</label><input id="taskTitle" class="form-input"></div>
          <div class="field-group"><label>Deskripsi</label><textarea id="taskDesc" class="form-textarea"></textarea></div>
          <div class="two-col">
            <div class="field-group"><label>Deadline</label><input id="taskDeadline" type="datetime-local" class="form-input"></div>
            <div class="field-group"><label>Foto / Lampiran Tugas</label><input id="taskPhoto" type="file" accept="image/*,.pdf" class="form-input"><small class="form-hint">Opsional. Foto/PDF akan tersimpan di Firebase Storage.</small></div>
            <div class="field-group"><label>Lampiran URL</label><input id="taskFile" class="form-input" placeholder="https://..."></div>
          </div>
          <button class="ios-btn primary" id="saveTask" type="button" style="padding:14px;justify-content:center">Terbitkan Tugas</button>
        </div>
      </div>
      <div>
        <h3 style="margin:0 0 12px;font-size:16px;font-weight:800">Tugas Aktif</h3>
        <div id="taskList" class="card-list"><div class="empty">Pilih mata pelajaran.</div></div>
      </div>
    </div>
  </section>
</main>

<nav class="ios-tab-bar" style="--tabs:6" aria-label="Navigasi Mobile Guru">
  <a href="guru.html">Utama</a>
  <a href="guru-tugas.html">Tugas</a>
  <a href="guru-pengumuman.html">Info</a>
  <a href="guru-materi.html">Materi</a>
  <a href="guru-absensi.html">Absen</a>
  <a href="guru-nilai.html">Nilai</a>
</nav>
<footer class="page-footer">XII TKJ 3 • SMK NU Bandar</footer>

<script src="assets/js/ios-core.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js";

const firebaseConfig = { apiKey: "AIzaSyAv8Jm4XzYPh7xU-Pcy6QmAtbKiVLvuTnw", authDomain: "absensi-xii-tkj3.firebaseapp.com", projectId: "absensi-xii-tkj3", storageBucket: "absensi-xii-tkj3.firebasestorage.app", messagingSenderId: "219267949077", appId: "1:219267949077:web:8cf7d62f31ae1987a6641c" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const q = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

const SUBJ_KEY = 'tkj3_guru_subject';
const defaultGuruSubjects = ["Administrasi Infrastruktur Jaringan","Administrasi Server","Teknologi Layanan Jaringan","Teknologi Jaringan Berbasis Luas (WAN)","Komputer dan Jaringan Dasar"];
let uid = '', teacher = '', current = '', unsub = null;

function renderSubjects(subjects) {
  const stored = localStorage.getItem(SUBJ_KEY);
  current = (stored && subjects.includes(stored)) ? stored : subjects[0];
  q('subjects').innerHTML = subjects.map(s => `<button type="button" class="subject-chip ${s===current?'active':''}" data-sub="${esc(s)}">${esc(s)}</button>`).join('');
  q('subjects').querySelectorAll('[data-sub]').forEach(b => b.onclick = () => {
    current = b.dataset.sub; localStorage.setItem(SUBJ_KEY, current);
    q('subjects').querySelectorAll('.subject-chip').forEach(c => c.classList.toggle('active', c === b));
    loadTasks();
  });
  if (current) localStorage.setItem(SUBJ_KEY, current);
  loadTasks();
}

function loadTasks() {
  if (unsub) unsub();
  if (!current) return;
  q('taskList').innerHTML = '<div class="empty">Memuat...</div>';
  unsub = onSnapshot(query(collection(db, 'tugas'), where('mapel', '==', current), orderBy('createdAt', 'desc')), snap => {
    q('taskList').innerHTML = snap.empty ? '<div class="empty">Belum ada tugas.</div>' : snap.docs.map(d => {
      const x = d.data();
      return `<article class="item-card">
        <span class="ios-pill blue">${esc(x.mapel)}</span>
        <h3 style="margin-top:8px">${esc(x.judul)}</h3>
        <p style="color:var(--muted-dark);font-size:13px;margin:0 0 8px">${esc(x.deskripsi)}</p>
        <div class="item-meta">Deadline: ${esc(x.deadline||'-')}</div>
        ${x.fileUrl?`<p style="margin:8px 0 0"><a href="${esc(x.fileUrl)}" target="_blank" rel="noopener" class="ios-btn" style="font-size:11px;padding:5px 10px">Lampiran URL</a></p>`:''}${x.attachmentUrl?`<p style="margin:8px 0 0"><a href="${esc(x.attachmentUrl)}" target="_blank" rel="noopener" class="ios-btn" style="font-size:11px;padding:5px 10px">${x.attachmentName?'Buka '+esc(x.attachmentName):'Buka lampiran'}</a></p>`:''}
        <div style="margin-top:10px"><button class="ios-btn danger" data-del="${d.id}" type="button">Hapus</button></div>
      </article>`;
    }).join('');
    q('taskList').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (confirm('Hapus tugas ini?')) await deleteDoc(doc(db, 'tugas', b.dataset.del)); });
  }, () => { q('taskList').innerHTML = '<div class="empty">Gagal memuat tugas.</div>'; });
}

async function loadTeacherSubjects(teacherUid, teacherSubjects) {
  try {
    const uSnap = await getDoc(doc(db, 'users', teacherUid || 'guru-andi'));
    if (uSnap.exists()) {
      const d = uSnap.data();
      if (d.nama) teacher = d.nama;
      if (Array.isArray(d.mataPelajaran) && d.mataPelajaran.length) teacherSubjects = d.mataPelajaran;
    }
  } catch (e) { console.warn(e); }
  renderSubjects((teacherSubjects && teacherSubjects.length) ? teacherSubjects : defaultGuruSubjects);
}

const rawSession = sessionStorage.getItem("tkj3_session");
if (rawSession) {
  try {
    const parsed = JSON.parse(rawSession);
    if (parsed.role === 'guru') { uid = parsed.username || 'guru-andi'; teacher = parsed.nama || parsed.username || 'Guru'; loadTeacherSubjects(uid, defaultGuruSubjects); }
  } catch (e) { console.error(e); }
}
onAuthStateChanged(auth, async user => {
  if (user) { uid = user.uid;
    try { const u = await getDoc(doc(db, 'users', uid)); if (u.exists() && u.data().role === 'guru') { const d = u.data(); teacher = d.nama || user.email; loadTeacherSubjects(uid, d.mataPelajaran || d.subjects || defaultGuruSubjects); } } catch (e) { console.warn(e); }
  }
});

q('saveTask').onclick = async () => {
  if (!current) return;
  const title=q('taskTitle').value.trim(), desc=q('taskDesc').value.trim(), deadline=q('taskDeadline').value, fileUrl=q('taskFile').value.trim(), photo=q('taskPhoto')?.files?.[0]||null;
  if(!title){ alert('Judul tugas wajib diisi.'); return; }
  if(photo && photo.size>10*1024*1024){ alert('Foto/PDF maksimal 10 MB.'); return; }
  q('saveTask').disabled = true;
  try {
    let attachmentUrl='';
    let attachmentName='';
    if(photo){
      const safe=(teacher||uid||'guru').replace(/[^a-z0-9_-]/gi,'_');
      const path=`tugas/${safe}/${Date.now()}_${photo.name.replace(/[^a-z0-9._-]/gi,'_')}`;
      const storageRef=ref(storage,path);
      await uploadBytes(storageRef,photo,{contentType:photo.type});
      attachmentUrl=await getDownloadURL(storageRef); attachmentName=photo.name;
    }
    await addDoc(collection(db, 'tugas'), { judul:title, deskripsi:desc, deadline, fileUrl, attachmentUrl, attachmentName, mapel:current, guruUid:uid, guru:teacher, createdAt:Date.now() });
    ['taskTitle','taskDesc','taskDeadline','taskFile','taskPhoto'].forEach(x => { if(q(x)) q(x).value=''; });
  } catch(e){ alert('Tugas gagal diterbitkan: '+(e.message||e)); }
  finally { q('saveTask').disabled = false; }
};

if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
</script>
</body>
</html>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";import {getFirestore,collection,onSnapshot,query,where,doc,getDoc,deleteDoc,updateDoc} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAv8Jm4XzYPh7xU-Pcy6QmAtbKiVLvuTnw", authDomain: "absensi-xii-tkj3.firebaseapp.com", projectId: "absensi-xii-tkj3", storageBucket: "absensi-xii-tkj3.firebasestorage.app", messagingSenderId: "219267949077", appId: "1:219267949077:web:8cf7d62f31ae1987a6641c" };
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),q=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let uid='',teacher='',current='',unsub=null;
function setAccountSubject(v){current=String(v||'').trim();q('accountSubject').textContent=current||'Mapel akun belum diatur';if(!current){q('submissionList').innerHTML='<div class=\"empty\">Mapel akun guru belum diatur.</div>';return}load()}
function load(){if(unsub)unsub();q('submissionList').innerHTML='<div class=\"empty\">Memuat...</div>';unsub=onSnapshot(query(collection(db,'pengumpulan_tugas'),where('mapel','==',current)),snap=>{const ds=[...snap.docs].sort((a,b)=>Number(b.data().updatedAt||0)-Number(a.data().updatedAt||0));q('submissionList').innerHTML=snap.empty?'<div class=\"empty\">Belum ada pengumpulan.</div>':ds.map(d=>{const x=d.data();return `<article class=\"item-card\"><b>${esc(x.siswa||'Siswa')}</b><div class=\"item-meta\">Tugas: ${esc(x.judulTugas||'-')} • ${x.updatedAt?new Date(x.updatedAt).toLocaleString('id-ID'):'-'}</div>${x.jawaban?`<p style=\"font-size:13px;color:var(--muted-dark)\">${esc(x.jawaban)}</p>`:''}${x.link?`<a href=\"${esc(x.link)}\" target=\"_blank\" class=\"ios-btn\">Buka link ↗</a>`:''}${x.photoUrl?`<div style=\"margin-top:10px\">${String(x.photoType||'').startsWith('image/')?`<img src=\"${esc(x.photoUrl)}\" alt=\"Foto tugas\" style=\"width:100%;max-height:360px;object-fit:contain;border-radius:16px\">`:''}<a href=\"${esc(x.photoUrl)}\" target=\"_blank\" class=\"ios-btn\">Buka file</a></div>`:''}<div style=\"margin-top:10px;display:flex;gap:8px\"><button class=\"ios-btn\" data-edit=\"${d.id}\">Edit</button><button class=\"ios-btn danger\" data-del=\"${d.id}\">Hapus</button></div></article>`}).join('');q('submissionList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{const d=snap.docs.find(z=>z.id===b.dataset.edit);if(!d)return;const x=d.data(),jaw=prompt('Edit jawaban/catatan:',x.jawaban||'');if(jaw===null)return;try{await updateDoc(doc(db,'pengumpulan_tugas',d.id),{jawaban:jaw,updatedAt:Date.now(),editedBy:'guru'})}catch(e){alert('Gagal mengedit: '+(e.message||e))}});q('submissionList').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Hapus pengumpulan siswa ini?'))try{await deleteDoc(doc(db,'pengumpulan_tugas',b.dataset.del))}catch(e){alert('Gagal menghapus: '+(e.message||e))}})},e=>q('submissionList').innerHTML='<div class=\"empty\">Gagal memuat pengumpulan: '+esc(e?.message||e)+'</div>')}
async function initTeacher(id){try{const u=await getDoc(doc(db,'users',id||'guru-andi'));if(u.exists()){const d=u.data();teacher=d.nama||teacher;let m=d.mataPelajaran??d.mapel??d.subject;if(Array.isArray(m))m=m[0];if(!m&&Array.isArray(d.subjects))m=d.subjects[0];setAccountSubject(m||'')}}catch(e){setAccountSubject('')}}
try{const p=JSON.parse(sessionStorage.getItem('tkj3_session')||'null');if(p?.role==='guru'){uid=p.username||'guru-andi';teacher=p.nama||uid;initTeacher(uid)}}catch(e){}
onAuthStateChanged(auth,async u=>{if(u){uid=u.uid;try{const s=await getDoc(doc(db,'users',uid));if(s.exists()&&s.data().role==='guru'){const d=s.data();teacher=d.nama||u.email;let m=d.mataPelajaran??d.mapel??d.subject;if(Array.isArray(m))m=m[0];if(!m&&Array.isArray(d.subjects))m=d.subjects[0];setAccountSubject(m||'')}}catch(e){}}});
</script>

<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="assets/css/ios-core.css">
<script src="auth-guard.js"></script>
</head>
<body>
<div class="ios-bg" aria-hidden="true"><div class="mesh-orb orb-1"></div><div class="mesh-orb orb-2"></div></div>

<header class="ios-navbar wrap ios-glass">
  <a class="back-btn" href="guru.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>Beranda</a>
  <div class="nav-tools">
    <div class="theme-segmented"><select data-theme-select aria-label="Mode Tampilan"><option value="light">Light</option><option value="dark">Dark</option><option value="system">Sistem</option></select></div>
    <button class="ios-btn danger" data-logout type="button">Keluar</button>
  </div>
</header>

<main class="wrap">
  <section class="hero" style="padding-top:8px">
    <div class="ios-kicker"><span class="kicker-dot"></span><span>Pengumpulan</span></div>
    <h1 style="font-size:clamp(26px,5vw,38px)">Pengumpulan Tugas Siswa</h1>
    <p>Lihat jawaban siswa untuk mata pelajaran yang sedang dipilih.</p>
  </section>

  <section class="section" style="padding-top:0">
    <div id="subjects" class="subject-row"><div class="empty">Memuat mata pelajaran...</div></div>
    <div id="submissionList" class="card-list" style="margin-top:6px"><div class="empty">Pilih mata pelajaran.</div></div>
  </section>
</main>

</nav>
<footer class="page-footer">XII TKJ 3 • SMK NU Bandar</footer>

<script src="assets/js/ios-core.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { getFirestore, collection, onSnapshot, query, where, orderBy, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyAv8Jm4XzYPh7xU-Pcy6QmAtbKiVLvuTnw", authDomain: "absensi-xii-tkj3.firebaseapp.com", projectId: "absensi-xii-tkj3", storageBucket: "absensi-xii-tkj3.firebasestorage.app", messagingSenderId: "219267949077", appId: "1:219267949077:web:8cf7d62f31ae1987a6641c" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const q = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

const SUBJ_KEY = 'tkj3_guru_subject';
const defaultGuruSubjects = ["Administrasi Infrastruktur Jaringan","Administrasi Server","Teknologi Layanan Jaringan","Teknologi Jaringan Berbasis Luas (WAN)","Komputer dan Jaringan Dasar"];
let current = '', unsub = null;

function renderSubjects(subjects) {
  const stored = localStorage.getItem(SUBJ_KEY);
  current = (stored && subjects.includes(stored)) ? stored : subjects[0];
  q('subjects').innerHTML = subjects.map(s => `<button type="button" class="subject-chip ${s===current?'active':''}" data-sub="${esc(s)}">${esc(s)}</button>`).join('');
  q('subjects').querySelectorAll('[data-sub]').forEach(b => b.onclick = () => {
    current = b.dataset.sub; localStorage.setItem(SUBJ_KEY, current);
    q('subjects').querySelectorAll('.subject-chip').forEach(c => c.classList.toggle('active', c === b));
    loadSub();
  });
  if (current) localStorage.setItem(SUBJ_KEY, current);
  loadSub();
}

function loadSub() {
  if (unsub) unsub();
  if (!current) return;
  q('submissionList').innerHTML = '<div class="empty">Memuat...</div>';
  unsub = onSnapshot(query(collection(db, 'pengumpulan_tugas'), where('mapel', '==', current), orderBy('updatedAt', 'desc')), snap => {
    q('submissionList').innerHTML = snap.empty ? '<div class="empty">Belum ada pengumpulan.</div>' : snap.docs.map(d => {
      const x = d.data();
      return `<article class="item-card">
        <b>${esc(x.siswa || 'Siswa')}</b>
        <div class="item-meta">Dikirim: ${x.updatedAt ? new Date(x.updatedAt).toLocaleString('id-ID') : '-'}</div>
        ${x.jawaban ? `<p style="font-size:13px;color:var(--muted-dark);margin:8px 0 0">${esc(x.jawaban)}</p>` : ''}
        ${x.link ? `<div style="margin-top:8px"><a href="${esc(x.link)}" target="_blank" rel="noopener" class="ios-btn" style="font-size:11px;padding:5px 10px">Buka link jawaban ↗</a></div>` : ''}
        ${x.photoUrl ? `<div style="margin-top:8px"><a href="${esc(x.photoUrl)}" target="_blank" rel="noopener" class="ios-btn" style="font-size:11px;padding:5px 10px">Lihat foto tugas ↗</a></div>` : ''}
      </article>`;
    }).join('');
  }, () => { q('submissionList').innerHTML = '<div class="empty">Gagal memuat pengumpulan.</div>'; });
}

async function loadTeacherSubjects(teacherUid, teacherSubjects) {
  try {
    const uSnap = await getDoc(doc(db, 'users', teacherUid || ''));
    if (uSnap.exists()) { const d = uSnap.data(); if (Array.isArray(d.mataPelajaran) && d.mataPelajaran.length) teacherSubjects = d.mataPelajaran; }
  } catch (e) { console.warn(e); }
  renderSubjects((teacherSubjects && teacherSubjects.length) ? teacherSubjects : defaultGuruSubjects);
}

const rawSession = sessionStorage.getItem("tkj3_session");
if (rawSession) { try { const parsed = JSON.parse(rawSession); if (parsed.role === 'guru') loadTeacherSubjects(parsed.username || '', defaultGuruSubjects); } catch (e) { console.error(e); } }
onAuthStateChanged(auth, async user => {
  if (user) {
    try { const u = await getDoc(doc(db, 'users', user.uid)); if (u.exists() && u.data().role === 'guru') { const d = u.data(); loadTeacherSubjects(user.uid, d.mataPelajaran || d.subjects || defaultGuruSubjects); } } catch (e) { console.warn(e); }
  }
});

if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
</script>
</body>
</html>

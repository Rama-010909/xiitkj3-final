const firebaseConfig={apiKey:"AIzaSyAv8Jm4XzYPh7xU-Pcy6QmAtbKiVLvuTnw",authDomain:"absensi-xii-tkj3.firebaseapp.com",projectId:"absensi-xii-tkj3",storageBucket:"absensi-xii-tkj3.firebasestorage.app",messagingSenderId:"219267949077",appId:"1:219267949077:web:8cf7d62f31ae1987a6641c"};const db=getFirestore(initializeApp(firebaseConfig)),q=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let editing='';function reset(){editing='';q('title').value='';q('body').value='';q('save').textContent='Terbitkan Pengumuman'}onSnapshot(collection(db,'pengumuman'),snap=>{const ds=[...snap.docs].sort((a,b)=>Number(b.data().createdAt||0)-Number(a.data().createdAt||0));q('list').innerHTML=ds.length?ds.map(d=>{const x=d.data();return `<article class="item-card"><span class="ios-pill purple">${esc(x.mapel||'Kelas')}</span><h3>${esc(x.judul)}</h3><p style="color:var(--muted-dark);font-size:13px">${esc(x.isi)}</p><div style="display:flex;gap:8px;margin-top:10px"><button class="ios-btn" data-edit="${d.id}">Edit</button><button class="ios-btn danger" data-del="${d.id}">Hapus</button></div></article>`}).join(''):'<div class="empty">Belum ada pengumuman.</div>';q('list').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const d=snap.docs.find(x=>x.id===b.dataset.edit),x=d.data();editing=d.id;q('title').value=x.judul||'';q('body').value=x.isi||'';q('save').textContent='Simpan Perubahan';window.scrollTo({top:0,behavior:'smooth'})});q('list').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Hapus pengumuman ini?'))await deleteDoc(doc(db,'pengumuman',b.dataset.del))})},e=>q('list').innerHTML='<div class="empty">Gagal memuat: '+esc(e?.message||e)+'</div>');q('save').onclick=async()=>{const judul=q('title').value.trim(),isi=q('body').value.trim();if(!judul||!isi){alert('Judul dan isi wajib diisi.');return}try{if(editing){await updateDoc(doc(db,'pengumuman',editing),{judul,isi

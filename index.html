<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>XII TKJ 3 — Login</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#e4e7ec;--accent:#2563eb}
[data-theme=dark]{--bg:#09111f;--card:#111c2d;--text:#f5f7fb;--muted:#aab5c8;--border:#2a3950;--accent:#60a5fa}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
.screen{position:fixed;inset:0;width:100%;height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(7%);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s linear .45s}
.screen.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition-delay:0s}
.bg{background:
radial-gradient(circle at 15% 15%,#3b82f625,transparent 30%),
radial-gradient(circle at 88% 82%,#8b5cf625,transparent 33%),var(--bg)}
.bg:before,.bg:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;filter:blur(75px);opacity:.24;pointer-events:none;animation:float 10s ease-in-out infinite alternate}
.bg:before{background:#3b82f6;left:-100px;top:-100px}.bg:after{background:#8b5cf6;right:-110px;bottom:-120px;animation-delay:-4s}
.wrap{position:relative;width:min(460px,100%);z-index:1}
.logo{width:76px;height:76px;border-radius:22px;margin:0 auto 18px;display:grid;place-items:center;background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--border);box-shadow:0 15px 40px #0002;font-size:32px;animation:pop .55s cubic-bezier(.2,.8,.2,1)}
.title{text-align:center;font-size:clamp(28px,5vw,38px);margin:0;font-weight:850;letter-spacing:-1px}
.subtitle{text-align:center;color:var(--muted);margin:8px 0 26px}
.roles{display:grid;gap:13px}
.role{width:100%;border:0;border-radius:20px;padding:17px 19px;color:#fff;display:flex;align-items:center;gap:13px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 12px 30px #0002;transition:transform .2s ease,filter .2s ease}
.role:hover{transform:translateY(-3px);filter:brightness(1.07)}.role:active{transform:scale(.98)}
.role span:nth-child(2){flex:1;text-align:left}.arrow{font-size:27px;font-weight:400}
.siswa{background:linear-gradient(135deg,#2563eb,#3b82f6)}.guru{background:linear-gradient(135deg,#7c3aed,#a855f7)}.admin{background:linear-gradient(135deg,#0f766e,#14b8a6)}
.login-card{width:min(420px,100%);margin:auto;background:color-mix(in srgb,var(--card) 95%,transparent);border:1px solid var(--border);border-radius:28px;padding:30px;box-shadow:0 25px 75px #0003;backdrop-filter:blur(20px)}
.back{border:0;background:none;color:var(--accent);font-weight:800;padding:0;margin:0 0 17px;cursor:pointer;font-size:14px}
.role-title{font-size:27px;margin:0}.role-desc{color:var(--muted);margin:6px 0 22px}
.field{margin:14px 0}.field label{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:7px}.field input{width:100%;height:48px;border:1px solid var(--border);border-radius:14px;background:var(--bg);color:var(--text);padding:0 48px 0 14px;outline:none;transition:border-color .2s,box-shadow .2s}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.input-wrap{position:relative}.eye{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:36px;height:36px;padding:8px;border:0;background:none;color:var(--muted);cursor:pointer}.eye svg{width:100%;height:100%}
.submit{width:100%;height:48px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--accent),#6366f1);color:#fff;font-weight:850;cursor:pointer;transition:transform .18s,filter .18s}.submit:hover{filter:brightness(1.08)}.submit:active{transform:scale(.98)}
.err{min-height:20px;color:#ef4444;font-size:13px;font-weight:650;margin-top:10px}
@keyframes float{to{transform:translate(42px,30px) scale(1.08)}}@keyframes pop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
@media(max-width:700px){
 .screen{padding:18px 14px;align-items:center}
 .wrap{width:100%;max-width:430px}
 .logo{width:66px;height:66px;border-radius:19px;font-size:27px;margin-bottom:15px}
 .title{font-size:27px}.subtitle{margin-bottom:22px}
 .role{min-height:58px;border-radius:17px;padding:15px 16px}
 .login-card{width:100%;border:0;border-radius:24px;padding:24px 20px;box-shadow:none;background:color-mix(in srgb,var(--card) 97%,transparent)}
}
@media(max-height:620px){
 .logo{display:none}.subtitle{margin-bottom:14px}.role{padding:12px 15px}.login-card{padding:18px}
}
@media(prefers-reduced-motion:reduce){
 .screen{transition:none}.bg:before,.bg:after,.logo{animation:none}
}
</style>
</head>
<body>
<section id="chooser" class="screen active bg" aria-label="Pilih akun">
<div class="wrap">
<div class="logo">🏫</div>
<h1 class="title">XII TKJ 3</h1>
<p class="subtitle">Pilih jenis akun untuk masuk</p>
<div class="roles">
<button class="role siswa" data-role="siswa"><span>👨‍🎓</span><span>Masuk Siswa</span><span class="arrow">›</span></button>
<button class="role guru" data-role="guru"><span>👨‍🏫</span><span>Masuk Guru</span><span class="arrow">›</span></button>
<button class="role admin" data-role="admin"><span>🛡️</span><span>Masuk Admin</span><span class="arrow">›</span></button>
</div>
</div>
</section>

<section id="login" class="screen bg" aria-label="Form login">
<div class="login-card">
<button id="back" class="back" type="button">← Kembali</button>
<h2 id="roleTitle" class="role-title">Login</h2>
<p id="roleDesc" class="role-desc">Masukkan username dan password.</p>
<div class="field"><label for="username">Username</label><input id="username" autocomplete="username" spellcheck="false"></div>
<div class="field"><label for="password">Password</label><div class="input-wrap">
<input id="password" type="password" autocomplete="current-password">
<button id="eye" class="eye" type="button" aria-label="Tampilkan password">
<svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
<svg id="eyeClosed" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18"/><path d="M10.6 6.2A10.9 10.9 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-3.1 3.7M6.2 6.2C3.5 8.1 2 12 2 12s3.5 6 10 6c1.2 0 2.3-.2 3.3-.6"/></svg>
</button>
</div></div>
<button id="submit" class="submit" type="button">Masuk</button>
<div id="err" class="err"></div>
</div>
</section>

<script>
const accounts={
 siswa:{username:"rama",password:"010909",target:"siswa.html",label:"Siswa"},
 guru:{username:"andi",password:"smknubandar",target:"guru.html",label:"Guru"},
 admin:{username:"tkj3",password:"smknubandar",target:"admin.html",label:"Admin"}
};
let role=null;
const $=id=>document.getElementById(id);
function showLogin(r){
 role=r;
 $("chooser").classList.remove("active");
 $("login").classList.add("active");
 $("roleTitle").textContent="Login "+accounts[r].label;
 $("roleDesc").textContent="Masukkan username dan password "+accounts[r].label.toLowerCase()+".";
 $("username").value="";$("password").value="";$("err").textContent="";
 $("password").type="password";$("eyeOpen").style.display="block";$("eyeClosed").style.display="none";
 setTimeout(()=>$("username").focus(),260);
}
document.querySelectorAll(".role").forEach(b=>b.addEventListener("click",()=>showLogin(b.dataset.role)));
$("back").addEventListener("click",()=>{
 $("login").classList.remove("active");$("chooser").classList.add("active");role=null;
});
$("eye").addEventListener("click",()=>{
 const show=$("password").type==="password";$("password").type=show?"text":"password";
 $("eyeOpen").style.display=show?"none":"block";$("eyeClosed").style.display=show?"block":"none";
});
function doLogin(){
 const a=accounts[role],u=$("username").value.trim().toLowerCase(),p=$("password").value;
 if(!u||!p){$("err").textContent="Username dan password wajib diisi.";return}
 if(!a||u!==a.username||p!==a.password){$("err").textContent="Username atau password salah.";return}
 sessionStorage.setItem("tkj3_session",JSON.stringify({username:u,role,nama:u}));
 location.href=a.target;
}
$("submit").addEventListener("click",doLogin);
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
</script>
</body>
</html>

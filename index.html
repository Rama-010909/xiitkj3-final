<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fb">
<title>Portal Login • XII TKJ 3</title>
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root{
  --bg:#f3f6fb;
  --card:rgba(255,255,255,.90);
  --card-border:rgba(255,255,255,.95);
  --text:#0f172a;
  --text-h:#020617;
  --muted:#52617a;
  --border:#e2e8f0;
  --input-bg:rgba(255,255,255,.92);
  --input-border:#cbd5e1;
  --accent:#2563eb;
  --shadow:0 18px 45px rgba(15,23,42,.07);
  --shadow-lg:0 25px 60px rgba(15,23,42,.12);
  --glow-1:#38bdf8;
  --glow-2:#34d399;
}
[data-theme="dark"]{
  --bg:#090e17;
  --card:rgba(18,25,41,.88);
  --card-border:rgba(255,255,255,.12);
  --text:#f8fafc;
  --text-h:#ffffff;
  --muted:#94a3b8;
  --border:rgba(255,255,255,.14);
  --input-bg:rgba(11,16,28,.90);
  --input-border:rgba(255,255,255,.16);
  --accent:#60a5fa;
  --shadow:0 20px 45px rgba(0,0,0,.45);
  --shadow-lg:0 25px 70px rgba(0,0,0,.60);
  --glow-1:#0ea5e9;
  --glow-2:#10b981;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:system-ui,-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:background-color .3s ease,color .3s ease;
}
.bg{
  background:
    radial-gradient(circle at 10% 12%, color-mix(in srgb,var(--glow-1) 28%,transparent) 0%, transparent 40%),
    radial-gradient(circle at 90% 88%, color-mix(in srgb,var(--glow-2) 28%,transparent) 0%, transparent 45%),
    var(--bg);
}
.bg:before,.bg:after{
  content:"";
  position:absolute;
  width:320px;
  height:320px;
  border-radius:50%;
  filter:blur(85px);
  opacity:.35;
  pointer-events:none;
  animation:float 10s ease-in-out infinite alternate;
}
.bg:before{background:var(--glow-1);left:-100px;top:-100px}
.bg:after{background:var(--glow-2);right:-100px;bottom:-100px;animation-delay:-5s}

.top-bar{
  position:fixed;
  top:16px;
  left:16px;
  right:16px;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  max-width:1100px;
  margin:0 auto;
}
.school-badge{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 14px;
  border-radius:99px;
  background:var(--card);
  border:1px solid var(--card-border);
  box-shadow:var(--shadow);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  font-size:12px;
  font-weight:750;
  color:var(--text);
  letter-spacing:.02em;
}
.school-badge .badge-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#10b981;
  box-shadow:0 0 0 3px rgba(16,185,129,.2);
}
.theme-switch{
  display:flex;
  align-items:center;
  gap:6px;
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:99px;
  padding:4px 10px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.theme-switch select{
  appearance:none;
  -webkit-appearance:none;
  background:transparent;
  border:0;
  color:var(--text);
  font-size:12px;
  font-weight:750;
  padding:5px 22px 5px 6px;
  cursor:pointer;
  outline:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 10px) 11px,calc(100% - 6px) 11px;
  background-size:4px 4px,4px 4px;
  background-repeat:no-repeat;
}

.screen{
  position:fixed;
  inset:0;
  width:100%;
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transform:scale(.97) translateY(12px);
  transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s linear .45s;
}
.screen.active{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transform:none;
  transition-delay:0s;
}
.wrap{
  position:relative;
  width:min(470px,100%);
  z-index:2;
  text-align:center;
}

.brand-card{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:16px;
  padding:12px 20px;
  border-radius:26px;
  background:var(--card);
  border:1px solid var(--card-border);
  box-shadow:var(--shadow);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  margin-bottom:18px;
  animation:pop .55s cubic-bezier(.2,.8,.2,1);
}
.brand-img{
  width:50px;
  height:50px;
  object-fit:contain;
  display:block;
  transition:transform .25s ease;
}
.brand-img:hover{
  transform:scale(1.08);
}
.brand-sep{
  width:1px;
  height:36px;
  background:var(--border);
}

.title{
  font-size:clamp(30px,6vw,42px);
  font-weight:900;
  letter-spacing:-.04em;
  margin:0 0 4px;
  color:var(--text-h);
}
.title .gradient{
  background:linear-gradient(110deg,#10b981,#0ea5e9,#6366f1);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.subtitle{
  color:var(--muted);
  font-size:14px;
  font-weight:600;
  margin:0 0 24px;
}

.roles{
  display:grid;
  gap:12px;
  width:100%;
}
.role{
  width:100%;
  border:0;
  border-radius:20px;
  padding:17px 20px;
  color:#fff;
  display:flex;
  align-items:center;
  gap:14px;
  font-size:15.5px;
  font-weight:800;
  cursor:pointer;
  box-shadow:var(--shadow);
  transition:transform .2s ease,box-shadow .2s ease,filter .2s ease;
}
.role:hover{
  transform:translateY(-3px);
  filter:brightness(1.06);
  box-shadow:var(--shadow-lg);
}
.role:active{
  transform:scale(.98);
}
.role-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  background:rgba(255,255,255,.22);
  display:grid;
  place-items:center;
  font-size:20px;
  flex:none;
}
.role-info{
  flex:1;
  text-align:left;
}
.role-info b{
  display:block;
  font-size:16px;
  line-height:1.2;
}
.role-info small{
  display:block;
  font-size:11.5px;
  font-weight:550;
  opacity:.9;
  margin-top:2px;
}
.role .arrow{
  font-size:22px;
  font-weight:400;
  opacity:.85;
}

.siswa{background:linear-gradient(135deg,#1d4ed8,#2563eb,#38bdf8)}
.guru{background:linear-gradient(135deg,#6d28d9,#7c3aed,#a855f7)}
.admin{background:linear-gradient(135deg,#047857,#059669,#10b981)}

.login-card{
  position:relative;
  width:min(440px,100%);
  margin:auto;
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:30px;
  padding:32px 30px;
  box-shadow:var(--shadow-lg);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  z-index:2;
}
.login-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}
.back-btn{
  border:0;
  background:transparent;
  color:var(--accent);
  font-weight:800;
  font-size:13.5px;
  padding:6px 0;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:transform .2s ease;
}
.back-btn:hover{
  transform:translateX(-3px);
}
.role-badge{
  font-size:11px;
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.08em;
  padding:5px 11px;
  border-radius:99px;
  color:#fff;
}
.role-badge.siswa{background:#2563eb}
.role-badge.guru{background:#7c3aed}
.role-badge.admin{background:#059669}

.role-title{
  font-size:26px;
  font-weight:850;
  letter-spacing:-.03em;
  margin:0 0 6px;
  color:var(--text-h);
}
.role-desc{
  color:var(--muted);
  font-size:13.5px;
  margin:0 0 20px;
  line-height:1.5;
}

.field{
  margin-bottom:16px;
  text-align:left;
}
.field label{
  display:block;
  font-size:12.5px;
  font-weight:800;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.04em;
  margin-bottom:7px;
}
.field input{
  width:100%;
  height:48px;
  border:1px solid var(--input-border);
  border-radius:15px;
  background:var(--input-bg);
  color:var(--text);
  font-size:15px;
  padding:0 46px 0 15px;
  outline:none;
  transition:border-color .2s ease,box-shadow .2s ease,background-color .2s ease;
}
.field input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent);
}
.input-wrap{
  position:relative;
}
.eye{
  position:absolute;
  right:6px;
  top:50%;
  transform:translateY(-50%);
  width:36px;
  height:36px;
  padding:7px;
  border:0;
  background:none;
  color:var(--muted);
  cursor:pointer;
  border-radius:10px;
  transition:color .2s ease,background .2s ease;
}
.eye:hover{
  color:var(--text);
  background:rgba(0,0,0,.05);
}
.eye svg{
  width:100%;
  height:100%;
}
.submit{
  width:100%;
  height:50px;
  border:0;
  border-radius:16px;
  background:linear-gradient(135deg,var(--accent),#4f46e5);
  color:#fff;
  font-size:15.5px;
  font-weight:850;
  cursor:pointer;
  margin-top:6px;
  box-shadow:0 10px 25px color-mix(in srgb,var(--accent) 35%,transparent);
  transition:transform .18s ease,filter .18s ease,box-shadow .18s ease;
}
.submit:hover{
  filter:brightness(1.08);
  transform:translateY(-2px);
  box-shadow:0 14px 30px color-mix(in srgb,var(--accent) 45%,transparent);
}
.submit:active{
  transform:scale(.98);
}
.err{
  min-height:22px;
  color:#ef4444;
  font-size:13px;
  font-weight:700;
  margin-top:12px;
  text-align:center;
}

@keyframes float{to{transform:translate(35px,25px) scale(1.06)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}

@media(max-width:600px){
  .top-bar{top:12px;left:12px;right:12px}
  .screen{padding:16px 14px}
  .brand-card{padding:10px 16px;gap:12px;margin-bottom:14px}
  .brand-img{width:42px;height:42px}
  .title{font-size:28px}
  .subtitle{margin-bottom:18px;font-size:13px}
  .role{padding:14px 16px}
  .role-icon{width:34px;height:34px;font-size:18px}
  .login-card{padding:24px 20px;border-radius:24px}
}
@media(max-height:640px){
  .top-bar{position:static;margin-bottom:8px}
  .brand-card{padding:8px 14px;margin-bottom:10px}
  .brand-img{width:36px;height:36px}
  .subtitle{margin-bottom:12px}
  .role{padding:12px 14px}
  .login-card{padding:20px 18px}
}
@media(prefers-reduced-motion:reduce){
  .screen{transition:none}
  .bg:before,.bg:after,.brand-card{animation:none}
}
</style>
</head>
<body>

<header class="top-bar">
  <div class="school-badge">
    <span class="badge-dot"></span>
    <span>Portal Resmi • XII TKJ 3</span>
  </div>
  <div class="theme-switch">
    <select id="themeSelect" aria-label="Mode Tampilan">
      <option value="light">☀️ Light</option>
      <option value="dark">🌙 Dark</option>
      <option value="system">💻 Sistem</option>
    </select>
  </div>
</header>

<section id="chooser" class="screen active bg" aria-label="Pilih akun login">
  <div class="wrap">
    <div class="brand-card">
      <img src="assets/galeri/logo-smk-transparent.png" alt="Logo SMK NU Bandar" class="brand-img" title="SMK NU Bandar">
      <div class="brand-sep"></div>
      <img src="assets/galeri/logo-kelas-light.png" data-light-src="assets/galeri/logo-kelas-light.png" data-dark-src="assets/galeri/logo-kelas-dark.png" alt="Logo Kelas XII TKJ 3" class="brand-img theme-logo" title="XII TKJ 3">
    </div>

    <h1 class="title">XII TKJ 3 <span class="gradient">Portal</span></h1>
    <p class="subtitle">SMK NU BANDAR • Pilih jenis akun untuk masuk</p>

    <div class="roles">
      <button class="role siswa" data-role="siswa" type="button">
        <span class="role-icon">👨‍🎓</span>
        <span class="role-info">
          <b>Masuk Siswa</b>
          <small>Absensi, tugas, materi, jadwal & nilai</small>
        </span>
        <span class="arrow">›</span>
      </button>

      <button class="role guru" data-role="guru" type="button">
        <span class="role-icon">👨‍🏫</span>
        <span class="role-info">
          <b>Masuk Guru</b>
          <small>Kelola materi, tugas, nilai & absensi pelajaran</small>
        </span>
        <span class="arrow">›</span>
      </button>

      <button class="role admin" data-role="admin" type="button">
        <span class="role-icon">🛡️</span>
        <span class="role-info">
          <b>Masuk Admin</b>
          <small>Kelola data siswa, guru, jadwal, struktur & galeri</small>
        </span>
        <span class="arrow">›</span>
      </button>
    </div>
  </div>
</section>

<section id="login" class="screen bg" aria-label="Form login">
  <div class="login-card">
    <div class="login-header">
      <button id="back" class="back-btn" type="button">← Pilih Akun</button>
      <span id="roleBadge" class="role-badge siswa">Siswa</span>
    </div>

    <h2 id="roleTitle" class="role-title">Login Siswa</h2>
    <p id="roleDesc" class="role-desc">Masukkan username dan password akun siswa.</p>

    <form id="loginForm" onsubmit="return false;">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" autocomplete="username" spellcheck="false" placeholder="Masukkan username" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input id="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required>
          <button id="eye" class="eye" type="button" aria-label="Tampilkan password">
            <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
            <svg id="eyeClosed" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18"/><path d="M10.6 6.2A10.9 10.9 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-3.1 3.7M6.2 6.2C3.5 8.1 2 12 2 12s3.5 6 10 6c1.2 0 2.3-.2 3.3-.6"/></svg>
          </button>
        </div>
      </div>

      <button id="submit" class="submit" type="submit">Masuk ke Portal →</button>
      <div id="err" class="err" role="alert"></div>
    </form>
  </div>
</section>

<script>
/* Theme System */
const THEME_KEY = 'xii-tkj3-theme';
const root = document.documentElement;
const themeSelect = document.getElementById('themeSelect');
const media = window.matchMedia('(prefers-color-scheme: dark)');

function applyTheme(mode) {
  const actual = mode === 'system' ? (media.matches ? 'dark' : 'light') : mode;
  root.setAttribute('data-theme', actual);
  if (themeSelect) themeSelect.value = mode;
  document.querySelectorAll('.theme-logo').forEach(img => {
    const src = actual === 'dark' ? img.dataset.darkSrc : img.dataset.lightSrc;
    if (src && img.getAttribute('src') !== src) img.src = src;
  });
}
const savedTheme = localStorage.getItem(THEME_KEY) || 'system';
applyTheme(savedTheme);

if (themeSelect) {
  themeSelect.addEventListener('change', e => {
    localStorage.setItem(THEME_KEY, e.target.value);
    applyTheme(e.target.value);
  });
}
if (media.addEventListener) {
  media.addEventListener('change', () => {
    if ((localStorage.getItem(THEME_KEY) || 'system') === 'system') applyTheme('system');
  });
}

/* Authentication & Navigation */
const accounts = {
  siswa: { username: "rama", password: "010909", target: "siswa.html", label: "Siswa", color: "siswa" },
  guru:  { username: "andi", password: "smknubandar", target: "guru.html", label: "Guru", color: "guru" },
  admin: { username: "tkj3", password: "smknubandar", target: "admin.html", label: "Admin", color: "admin" }
};
let selectedRole = null;
const $ = id => document.getElementById(id);

function showLogin(r) {
  selectedRole = r;
  const acc = accounts[r];
  $("chooser").classList.remove("active");
  $("login").classList.add("active");
  $("roleTitle").textContent = "Login " + acc.label;
  $("roleDesc").textContent = "Masukkan username dan password akun " + acc.label.toLowerCase() + ".";
  $("roleBadge").textContent = acc.label;
  $("roleBadge").className = "role-badge " + acc.color;
  $("username").value = "";
  $("password").value = "";
  $("err").textContent = "";
  $("password").type = "password";
  $("eyeOpen").style.display = "block";
  $("eyeClosed").style.display = "none";
  setTimeout(() => $("username").focus(), 250);
}

document.querySelectorAll(".role").forEach(b => {
  b.addEventListener("click", () => showLogin(b.dataset.role));
});

$("back").addEventListener("click", () => {
  $("login").classList.remove("active");
  $("chooser").classList.add("active");
  selectedRole = null;
});

$("eye").addEventListener("click", () => {
  const isPass = $("password").type === "password";
  $("password").type = isPass ? "text" : "password";
  $("eyeOpen").style.display = isPass ? "none" : "block";
  $("eyeClosed").style.display = isPass ? "block" : "none";
});

function doLogin() {
  const a = accounts[selectedRole];
  const u = $("username").value.trim().toLowerCase();
  const p = $("password").value;
  if (!u || !p) {
    $("err").textContent = "Username dan password wajib diisi.";
    return;
  }
  if (!a || u !== a.username || p !== a.password) {
    $("err").textContent = "Username atau password salah.";
    return;
  }
  sessionStorage.setItem("tkj3_session", JSON.stringify({
    username: u,
    role: selectedRole,
    nama: a.label
  }));
  if (selectedRole === "admin") {
    sessionStorage.setItem("admin", "1");
  }
  location.href = a.target;
}

$("submit").addEventListener("click", doLogin);
$("loginForm").addEventListener("submit", e => {
  e.preventDefault();
  doLogin();
});
</script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f2f5f9">

<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="assets/css/ios-core.css">
<script src="auth-guard.js"></script>
</head>
<body>
<div class="ios-bg" aria-hidden="true"><div class="mesh-orb orb-1"></div><div class="mesh-orb orb-2"></div></div>

<header class="ios-navbar wrap ios-glass">
  <a class="back-btn" href="siswa.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>Beranda</a>
  <div class="nav-tools">
    <div class="theme-segmented"><select data-theme-select aria-label="Mode Tampilan"><option value="light">Light</option><option value="dark">Dark</option><option value="system">Sistem</option></select></div>
    <button class="ios-btn danger" data-logout type="button">Keluar</button>
  </div>
</header>

<main class="wrap">
  <section class="hero" style="padding-top:8px">
    <div class="ios-kicker"><span class="kicker-dot"></span><span>Pelajaran</span></div>
    <h1 style="font-size:clamp(26px,5vw,38px)">Jadwal Pelajaran Kelas</h1>
    <p>Jadwal mata pelajaran Senin sampai Sabtu kelas XII TKJ 3.</p>
  </section>
  <section class="section" style="padding-top:0">
    <div id="scheduleContainer" class="schedule-grid"><div class="empty">Memuat jadwal pelajaran...</div></div>
  </section>
</main>

<nav class="ios-tab-bar" style="--tabs:6" aria-label="Navigasi Mobile Siswa">

  <a href="siswa-absensi.html">Absen</a>

</nav>
<footer class="page-footer">XII TKJ 3 • SMK NU Bandar</footer>

<script src="assets/js/ios-core.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAv8Jm4XzYPh7xU-Pcy6QmAtbKiVLvuTnw", authDomain: "absensi-xii-tkj3.firebaseapp.com", projectId: "absensi-xii-tkj3", storageBucket: "absensi-xii-tkj3.firebasestorage.app", messagingSenderId: "219267949077", appId: "1:219267949077:web:8cf7d62f31ae1987a6641c" };
const db = getFirestore(initializeApp(firebaseConfig));
const q = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

const dayOrder = ["Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
const currentDayName = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"][new Date().getDay()];

onSnapshot(collection(db, "jadwal"), snap => {
  const container = q('scheduleContainer');
  const schedule = {};
  dayOrder.forEach(d => schedule[d] = []);
  snap.forEach(ds => {
    const x = ds.data() || {};
    const day = dayOrder.find(d => d.toLowerCase() === (ds.id || '').toLowerCase() || d.toLowerCase() === (x.hari || '').toLowerCase());
    if (day && Array.isArray(x.entries)) schedule[day] = x.entries;
  });
  container.innerHTML = dayOrder.map(day => {
    const items = schedule[day] || [];
    const isToday = day === currentDayName;
    return `<div class="day-card ios-glass ${isToday ? 'today' : ''}">
      <div class="day-title"><span>${day} ${isToday ? '<span class="ios-pill" style="font-size:10px">HARI INI</span>' : ''}</span><small style="color:var(--muted-dark);font-size:12px">${items.length} Mapel</small></div>
      <div class="day-items">${items.length ? items.map(it => `<div class="day-item"><b style="font-weight:750">${esc(it.mapel)}</b><small style="color:var(--muted-dark)">Waktu: ${esc(it.jam || '-')}</small></div>`).join('') : '<div style="color:var(--muted-dark);font-size:12px;padding:8px">Tidak ada jadwal.</div>'}</div>
    </div>`;
  }).join('');
});
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
</script>
</body>
</html>

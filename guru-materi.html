<body>
<div class="ios-bg" aria-hidden="true"><div class="mesh-orb orb-1"></div><div class="mesh-orb orb-2"></div></div>

<header class="ios-navbar wrap ios-glass">
  <a class="back-btn" href="guru.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>Beranda</a>
  <div class="nav-tools">
    <div class="theme-segmented"><select data-theme-select aria-label="Mode Tampilan"><option value="light">Light</option><option value="dark">Dark</option><option value="system">Sistem</option></select></div>
    <button class="ios-btn danger" data-logout type="button">Keluar</button>
  </div>
</header>

<main class="wrap">
  <section class="hero" style="padding-top:8px">
    <div class="ios-kicker"><span class="kicker-dot"></span><span>Materi</span></div>
    <h1 style="font-size:clamp(26px,5vw,38px)">Kelola Materi</h1>
    <p>Bagikan bahan ajar untuk mata pelajaran sesuai akun guru.</p>
  </section>

  <section class="section" style="padding-top:0">
    <div id="subjects" class="subject-row"><span class="subject-chip active" id="accountSubject">Memuat mapel akun...</span></div>

          <div class="field-group"><label>Judul</label><input id="matTitle" class="form-input"></div>
          <div class="field-group"><label>Link materi</label><input id="matUrl" class="form-input" placeholder="URL PDF/Drive/dll."></div>
          <button class="ios-btn primary" id="saveMat" type="button" style="padding:14px;justify-content:center">Simpan Materi</button>
        </div>
      </div>
      <div>
        <h3 style="margin:0 0 12px;font-size:16px;font-weight:800">Materi Aktif</h3>

<script src="assets/js/ios-core.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js"; import { getAuth,onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js"; import { getFirestore,collection,addDoc,onSnapshot,query,where,doc,getDoc,deleteDoc,updateDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAv8Jm4XzYPh7xU-Pcy6QmAtbKiVLvuTnw", authDomain: "absensi-xii-tkj3.firebaseapp.com", projectId: "absensi-xii-tkj3", storageBucket: "absensi-xii-tkj3.firebasestorage.app", messagingSenderId: "219267949077", appId: "1:219267949077:web:8cf7d62f31ae1987a6641c" };
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),q=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let uid='',teacher='',current='',unsub=null,editing='';
function setAccountSubject(v){current=String(v||'').trim();q('accountSubject').textContent=current||'Mapel akun belum diatur';if(!current){q('matList').innerHTML='<div class=\"empty\">Mapel akun guru belum diatur.</div>';return}load()}
function reset(){editing='';q('matTitle').value='';q('matUrl').value='';q('saveMat').textContent='Terbitkan'}
function load(){if(unsub)unsub();q('matList').innerHTML='<div class=\"empty\">Memuat...</div>';unsub=onSnapshot(query(collection(db,'materi'),where('mapel','==',current)),snap=>{const ds=[...snap.docs].sort((a,b)=>Number(b.data().createdAt||0)-Number(a.data().createdAt||0));q('matList').innerHTML=snap.empty?'<div class=\"empty\">Belum ada materi.</div>':ds.map(d=>{const x=d.data();return `<article class=\"item-card\"><span class=\"ios-pill blue\">${esc(x.mapel)}</span><h3 style=\"margin-top:6px\">${esc(x.judul)}</h3><div class=\"item-meta\"><a href=\"${esc(x.url)}\" target=\"_blank\" rel=\"noopener\">Buka materi ↗</a></div><div style=\"margin-top:10px;display:flex;gap:8px\"><button class=\"ios-btn\" data-edit=\"${d.id}\" type=\"button\">Edit</button><button class=\"ios-btn danger\" data-del=\"${d.id}\" type=\"button\">Hapus</button></div></article>`}).join('');q('matList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const d=snap.docs.find(z=>z.id===b.dataset.edit),x=d.data();editing=d.id;q('matTitle').value=x.judul||'';q('matUrl').value=x.url||'';q('saveMat').textContent='Simpan Perubahan';window.scrollTo({top:0,behavior:'smooth'})});q('matList').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Hapus materi ini?'))await deleteDoc(doc(db,'materi',b.dataset.del))})},e=>q('matList').innerHTML='<div class=\"empty\">Gagal memuat materi: '+esc(e?.message||e)+'</div>')}
async function initTeacher(id){try{const u=await getDoc(doc(db,'users',id||'guru-andi'));if(u.exists()){const d=u.data();teacher=d.nama||teacher;let m=d.mataPelajaran??d.mapel??d.subject;if(Array.isArray(m))m=m[0];if(!m&&Array.isArray(d.subjects))m=d.subjects[0];setAccountSubject(m||'')}}catch(e){setAccountSubject('')}}
try{const p=JSON.parse(sessionStorage.getItem('tkj3_session')||'null');if(p?.role==='guru'){uid=p.username||'guru-andi';teacher=p.nama||uid;initTeacher(uid)}}catch(e){}
onAuthStateChanged(auth,async u=>{if(u){uid=u.uid;try{const s=await getDoc(doc(db,'users',uid));if(s.exists()&&s.data().role==='guru'){const d=s.data();teacher=d.nama||u.email;let m=d.mataPelajaran??d.mapel??d.subject;if(Array.isArray(m))m=m[0];if(!m&&Array.isArray(d.subjects))m=d.subjects[0];setAccountSubject(m||'')}}catch(e){}}});
q('saveMat').onclick=async()=>{if(!current)return;const title=q('matTitle').value.trim(),url=q('matUrl').value.trim();if(!title||!url){alert('Judul dan link materi wajib diisi.');return}q('saveMat').disabled=true;try{const data={judul:title,url,mapel:current,guruUid:uid,guru:teacher,updatedAt:Date.now()};if(editing){await updateDoc(doc(db,'materi',editing),data);alert('Materi berhasil diperbarui.')}else{await addDoc(collection(db,'materi'),{...data,createdAt:Date.now()});alert('Materi berhasil dikirim.')}reset()}catch(e){alert('Materi gagal disimpan: '+(e.message||e))}finally{q('saveMat').disabled=false}};
</script>
</body>
</html>

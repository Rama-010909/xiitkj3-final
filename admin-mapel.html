<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="XII TKJ 3">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f2f5f9">
<title>Jumlah Mapel • Admin</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="assets/css/ios-core.css">
<script src="auth-guard.js"></script>
</head>
<body>
<div class="ios-bg" aria-hidden="true"><div class="mesh-orb orb-1"></div><div class="mesh-orb orb-2"></div></div>

<header class="ios-navbar wrap ios-glass">
  <a class="back-btn" href="admin.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>Beranda</a>
  <div class="nav-tools">
    <div class="theme-segmented"><select data-theme-select aria-label="Mode Tampilan"><option value="light">Light</option><option value="dark">Dark</option><option value="system">Sistem</option></select></div>
    <button class="ios-btn danger" data-logout type="button">Keluar</button>
  </div>
</header>

<main class="wrap">
  <section class="hero" style="padding-top:8px">
    <div class="ios-kicker"><span class="kicker-dot"></span><span>Pengaturan</span></div>
    <h1 style="font-size:clamp(26px,5vw,38px)">Jumlah Mata Pelajaran</h1>
    <p>Jumlah ini ditampilkan di halaman siswa. Kamu bisa mengubah angkanya tanpa harus mengikuti jumlah mata pelajaran di jadwal.</p>
  </section>
  <section class="section" style="padding-top:0">
    <div class="ios-panel ios-glass" style="max-width:520px">
      <div class="field-group"><label>Jumlah mata pelajaran</label><input id="manualSubjectCount" type="number" min="0" step="1" class="form-input" placeholder="Contoh: 11"></div>
      <button class="ios-btn primary" id="saveSubjectCount" type="button" style="margin-top:14px;padding:14px;justify-content:center">Simpan Jumlah</button>
      <div id="subjectCountMessage" class="toast"></div>
    </div>
  </section>
</main>

<footer class="page-footer">XII TKJ 3 • Admin</footer>

<script src="assets/js/ios-core.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAv8Jm4XzYPh7xU-Pcy6QmAtbKiVLvuTnw", authDomain: "absensi-xii-tkj3.firebaseapp.com", projectId: "absensi-xii-tkj3", storageBucket: "absensi-xii-tkj3.firebasestorage.app", messagingSenderId: "219267949077", appId: "1:219267949077:web:8cf7d62f31ae1987a6641c" };
const db = getFirestore(initializeApp(firebaseConfig));
const manualSubjectInput = document.getElementById("manualSubjectCount");
const manualSubjectMsg = document.getElementById("subjectCountMessage");

async function loadSubjectSetting() {
  try {
    const snap = await getDoc(doc(db, "pengaturan", "homeStats"));
    if (snap.exists() && Number.isFinite(Number(snap.data().subjectCount))) manualSubjectInput.value = Math.max(0, Math.floor(Number(snap.data().subjectCount)));
  } catch (e) { console.warn(e); }
}
document.getElementById("saveSubjectCount").onclick = async () => {
  const n = Math.max(0, Math.floor(Number(manualSubjectInput.value)));
  if (!Number.isFinite(n)) { manualSubjectMsg.textContent = "Masukkan jumlah yang valid."; manualSubjectMsg.className = "toast err"; return; }
  try { await setDoc(doc(db, "pengaturan", "homeStats"), { subjectCount: n }, { merge: true }); manualSubjectMsg.textContent = "Jumlah mata pelajaran berhasil disimpan."; manualSubjectMsg.className = "toast"; }
  catch (e) { manualSubjectMsg.textContent = "Gagal menyimpan jumlah: " + (e.message || e); manualSubjectMsg.className = "toast err"; }
};
loadSubjectSetting();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
</script>
</body>
</html>

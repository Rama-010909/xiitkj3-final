<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import {getFirestore,collection,onSnapshot} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAv8Jm4XzYPh7xU-Pcy6QmAtbKiVLvuTnw", authDomain: "absensi-xii-tkj3.firebaseapp.com", projectId: "absensi-xii-tkj3", storageBucket: "absensi-xii-tkj3.firebasestorage.app", messagingSenderId: "219267949077", appId: "1:219267949077:web:8cf7d62f31ae1987a6641c" };
const db=getFirestore(initializeApp(firebaseConfig)),q=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let items=[];function render(){const sel=q('announcementSelect'),box=q('annList');if(!items.length){sel.innerHTML='<option value="">Belum ada pengumuman</option>';box.innerHTML='<div class="empty">Belum ada pengumuman kelas.</div>';return}sel.innerHTML='<option value="all">Semua pengumuman</option>'+items.map(x=>`<option value="${esc(x.id)}">${esc(x.judul)}</option>`).join('');const id=sel.value||'all',shown=id==='all'?items:items.filter(x=>x.id===id);box.innerHTML=shown.map(x=>`<article class="item-card"><span class="ios-pill purple">${esc(x.mapel||'Kelas')}</span><h3 style="margin-top:6px">${esc(x.judul)}</h3><p style="color:var(--muted-dark);font-size:13.5px;line-height:1.5">${esc(x.isi)}</p><div class="item-meta"><small>${x.createdAt?new Date(x.createdAt).toLocaleDateString('id-ID'):'-'}</small>${x.guru?`<small>• ${esc(x.guru)}</small>`:''}</div></article>`).join('')}onSnapshot(collection(db,'pengumuman'),snap=>{items=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));render()},e=>q('annList').innerHTML='<div class="empty">Gagal memuat pengumuman: '+esc(e?.message||e)+'</div>');q('announcementSelect').onchange=render;
</script>

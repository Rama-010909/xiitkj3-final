<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="XII TKJ 3">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f2f5f9">
<title>Galeri • Ruang Siswa</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="assets/css/ios-core.css">
<script src="auth-guard.js"></script>
</head>
<body>
<div class="ios-bg" aria-hidden="true"><div class="mesh-orb orb-1"></div><div class="mesh-orb orb-2"></div></div>

<header class="ios-navbar wrap ios-glass">
  <a class="back-btn" href="siswa.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>Beranda</a>
  <div class="nav-tools">
    <div class="theme-segmented"><select data-theme-select aria-label="Mode Tampilan"><option value="light">Light</option><option value="dark">Dark</option><option value="system">Sistem</option></select></div>
    <button class="ios-btn danger" data-logout type="button">Keluar</button>
  </div>
</header>

<main class="wrap">
  <section class="hero" style="padding-top:8px">
    <div class="ios-kicker"><span class="kicker-dot"></span><span>Dokumentasi</span></div>
    <h1 style="font-size:clamp(26px,5vw,38px)">Galeri Momen Kelas</h1>
    <p>Foto dan dokumentasi kegiatan kelas XII TKJ 3. Ketuk foto untuk memperbesar.</p>
  </section>
  <section class="section" style="padding-top:0">
    <div id="galleryContainer" class="gallery-grid"><div class="empty">Memuat galeri kelas...</div></div>
  </section>
</main>

<div id="lightbox" class="gallery-lightbox" aria-hidden="true">
  <button id="lightboxClose" class="gallery-lightbox-close" aria-label="Tutup foto">×</button>
  <img id="lightboxImg" src="" alt="Momen XII TKJ 3">
</div>

<nav class="ios-tab-bar" style="--tabs:6" aria-label="Navigasi Mobile Siswa">
  <a href="siswa.html">Utama</a>
  <a href="siswa-absensi.html">Absen</a>
  <a href="siswa-tugas.html">Tugas</a>
  <a href="siswa-materi.html">Materi</a>
  <a href="siswa-jadwal.html">Jadwal</a>
  <a href="siswa-galeri.html">Galeri</a>
</nav>
<footer class="page-footer">XII TKJ 3 • SMK NU Bandar</footer>

<script src="assets/js/ios-core.js"></script>
<script type="module">
const q = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

const localMoments = [1,2,3,4,5,6,7].map(n => ({ id: `momen-${n}`, src: `assets/galeri/momen-${n}.jpg`, name: `Momen Kelas ${n}` }));

async function loadGallery() {
  try {
    const res = await fetch("/api/gallery");
    const json = await res.json();
    const items = (json.items && json.items.length) ? json.items : localMoments;
    renderGallery(items);
  } catch (e) { renderGallery(localMoments); }
}
function renderGallery(items) {
  const container = q('galleryContainer');
  container.innerHTML = items.map(img => `<div class="gallery-card ios-glass" data-src="${esc(img.src)}"><img src="${esc(img.src)}" alt="${esc(img.name || 'Galeri')}" loading="lazy"></div>`).join('');
  container.querySelectorAll('[data-src]').forEach(card => card.addEventListener('click', () => openLightbox(card.dataset.src)));
}
loadGallery();

const lb = q('lightbox'), lbImg = q('lightboxImg'), lbClose = q('lightboxClose');
function openLightbox(src) { lbImg.src = src; lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden'; }
function closeLightbox() { lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true'); lbImg.src = ''; document.body.style.overflow = ''; }
lbClose.addEventListener('click', closeLightbox);
lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
</script>
</body>
</html>

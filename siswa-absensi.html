<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f2f5f9">
<title>Absensi • Ruang Siswa</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="assets/css/ios-core.css">
<script src="auth-guard.js"></script>
</head>
<body>
<div class="ios-bg" aria-hidden="true"><div class="mesh-orb orb-1"></div><div class="mesh-orb orb-2"></div></div>

<header class="ios-navbar wrap ios-glass">
  <a class="back-btn" href="siswa.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>Beranda</a>
  <div class="nav-tools">
    <div class="theme-segmented"><select data-theme-select aria-label="Mode Tampilan"><option value="light">Light</option><option value="dark">Dark</option><option value="system">Sistem</option></select></div>
    <button class="ios-btn danger" data-logout type="button">Keluar</button>
  </div>
</header>

<main class="wrap">
  <section class="hero" style="padding-top:8px">
    <div class="ios-kicker"><span class="kicker-dot"></span><span>Kehadiran</span></div>
    <h1 style="font-size:clamp(26px,5vw,38px)">Absensi Harian</h1>
    <p>Kirim kehadiran Anda setiap hari selama jam absensi dibuka, pukul <b>06.00</b> – <b>15.00</b>.</p>
  </section>

  <section class="section" style="padding-top:0">
    <div class="two-col">
      <div class="ios-panel ios-glass">
        <div id="absenWindowBanner" class="item-card" style="padding:12px 16px;margin-bottom:14px;animation-delay:0s"><div class="empty" style="padding:0">Memeriksa jam absensi...</div></div>
        <form id="absenForm" class="form-grid" onsubmit="return false;">
          <div class="field-group">
            <label>Nama Siswa</label>
            <div class="account-name-card"><span class="account-name-avatar"></span><span><small>Login sebagai</small><b id="absenNamaText">Memuat nama...</b></span></div>
          </div>
          <div class="field-group">
            <label>Status Kehadiran</label>
            <div class="status-radios">
              <label class="status-radio"><input type="radio" name="absenStatus" value="HADIR" checked><span class="status-btn">Hadir</span></label>
              <label class="status-radio"><input type="radio" name="absenStatus" value="IZIN"><span class="status-btn">Izin</span></label>
              <label class="status-radio"><input type="radio" name="absenStatus" value="SAKIT"><span class="status-btn">Sakit</span></label>
              <label class="status-radio"><input type="radio" name="absenStatus" value="LIBUR"><span class="status-btn">Libur</span></label>
            </div>
          </div>
          <div class="field-group">
            <label for="absenKet">Keterangan (Opsional)</label>
            <input id="absenKet" class="form-input" placeholder="Contoh: Sakit demam / Keperluan keluarga">
          </div>
          <button id="submitAbsen" class="ios-btn primary" type="submit" style="padding:14px;justify-content:center;font-size:14px">Kirim Absensi Sekarang</button>
          <div id="absenToast" class="toast"></div>
        </form>
      </div>

      <div class="ios-panel ios-glass">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <strong style="font-size:15px">Data Absensi Hari Ini</strong>
          <span id="todayDateLabel" style="font-size:12px;color:var(--muted-dark)"></span>
        </div>
        <div id="todayAbsenList" class="card-list" style="max-height:420px;overflow-y:auto"><div class="empty">Memuat data absensi...</div></div>
      </div>
    </div>
  </section>
</main>

<nav class="ios-tab-bar" style="--tabs:6" aria-label="Navigasi Mobile Siswa">
  <a href="siswa.html">Utama</a>
  <a href="siswa-absensi.html">Absen</a>
  <a href="siswa-tugas.html">Tugas</a>
  <a href="siswa-materi.html">Materi</a>
  <a href="siswa-jadwal.html">Jadwal</a>
  <a href="siswa-galeri.html">Galeri</a>
</nav>
<footer class="page-footer">XII TKJ 3 • SMK NU Bandar</footer>

<script src="assets/js/ios-core.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAv8Jm4XzYPh7xU-Pcy6QmAtbKiVLvuTnw",
  authDomain: "absensi-xii-tkj3.firebaseapp.com",
  projectId: "absensi-xii-tkj3",
  storageBucket: "absensi-xii-tkj3.firebasestorage.app",
  messagingSenderId: "219267949077",
  appId: "1:219267949077:web:8cf7d62f31ae1987a6641c"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const q = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

const rawSession = sessionStorage.getItem("tkj3_session");
const userSession = rawSession ? JSON.parse(rawSession) : { nama: "Siswa", username: "siswa" };
const studentName = userSession.nama || userSession.username || "Siswa";
q('absenNamaText').textContent = studentName;

const todayStr = new Date().toISOString().slice(0, 10);
q('todayDateLabel').textContent = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

/* --- Jam buka absensi: 06.00 - 15.00 --- */
const ABSEN_OPEN_HOUR = 6, ABSEN_CLOSE_HOUR = 15;
function isAbsenWindowOpen(d = new Date()) {
  const hours = d.getHours() + d.getMinutes() / 60;
  return hours >= ABSEN_OPEN_HOUR && hours < ABSEN_CLOSE_HOUR;
}
function refreshAbsenWindow() {
  const now = new Date();
  const open = isAbsenWindowOpen(now);
  const banner = q('absenWindowBanner');
  const btn = q('submitAbsen');
  const jamNow = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  if (open) {
    banner.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="ios-pill">Absensi Dibuka</span><small style="color:var(--muted-dark)">Sekarang ${jamNow} • tutup 15.00</small></div>`;
    btn.disabled = false;
    btn.textContent = 'Kirim Absensi Sekarang';
  } else {
    const msg = now.getHours() < ABSEN_OPEN_HOUR ? `Absensi belum dibuka. Silakan kembali mulai pukul 06.00.` : `Absensi hari ini sudah ditutup sejak pukul 15.00.`;
    banner.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span class="ios-pill danger">Absensi Ditutup</span><small style="color:var(--muted-dark)">${msg}</small></div>`;
    btn.disabled = true;
    btn.textContent = 'Di Luar Jam Absensi (06.00–15.00)';
  }
}
refreshAbsenWindow();
setInterval(refreshAbsenWindow, 30000);

onSnapshot(collection(db, "absensi"), snap => {
  const rows = [];
  snap.forEach(d => rows.push({ id: d.id, ...d.data() }));
  const todayRows = rows.filter(r => r.tanggal === todayStr);
  if (!todayRows.length) { q('todayAbsenList').innerHTML = '<div class="empty">Belum ada siswa yang absen hari ini.</div>'; return; }
  todayRows.sort((a, b) => (b.waktu || "").localeCompare(a.waktu || ""));
  q('todayAbsenList').innerHTML = todayRows.map(r => `
    <div class="item-card" style="padding:12px 16px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b style="font-weight:750">${esc(r.nama)}</b>
        <span class="ios-pill ${r.status==='HADIR'?'':'blue'}">${esc(r.status)}</span>
      </div>
      <div class="item-meta" style="margin-top:4px"><span>Waktu: ${esc(r.waktu || '-')}</span>${r.keterangan ? `<span>• ${esc(r.keterangan)}</span>` : ''}</div>
    </div>
  `).join('');
});

q('submitAbsen').addEventListener('click', async () => {
  const nama = String(studentName || '').trim();
  const statusEl = document.querySelector('input[name="absenStatus"]:checked');
  const status = statusEl ? statusEl.value : 'HADIR';
  const keterangan = q('absenKet').value.trim();
  const toast = q('absenToast');
  if (!isAbsenWindowOpen()) { refreshAbsenWindow(); toast.textContent = "Absensi hanya bisa dikirim pukul 06.00–15.00."; toast.className = "toast err"; return; }
  if (!nama) { toast.textContent = "Nama akun belum tersedia. Silakan login ulang."; toast.className = "toast err"; return; }
  const now = new Date();
  const waktu = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  q('submitAbsen').disabled = true; toast.textContent = "Mengirim absensi..."; toast.className = "toast";
  try {
    await addDoc(collection(db, "absensi"), { nama, status, keterangan, tanggal: todayStr, waktu, timestamp: Date.now() });
    toast.textContent = `Absensi ${nama} (${status}) berhasil terkirim.`; toast.className = "toast";
    q('absenKet').value = '';
  } catch (e) {
    console.error("Absen submit:", e);
    toast.textContent = "Gagal mengirim absensi: " + (e.message || e); toast.className = "toast err";
  } finally { q('submitAbsen').disabled = false; }
});

if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
</script>
</body>
</html>

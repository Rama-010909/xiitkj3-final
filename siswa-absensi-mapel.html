<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f2f5f9"><title>Absensi Mapel • XII TKJ 3</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="assets/css/ios-core.css"><script src="auth-guard.js"></script>
<style>
.session-card{padding:18px;border-radius:22px;margin-bottom:12px}.session-card.open{border:1px solid color-mix(in srgb,var(--accent) 28%,var(--card-border));}.session-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.session-title{font-size:17px;font-weight:900}.session-meta{font-size:12px;color:var(--muted-dark);margin-top:6px}.status-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.status-row label{cursor:pointer}.status-row input{position:absolute;opacity:0}.status-btn{display:block;text-align:center;border:1px solid var(--card-border);border-radius:13px;padding:10px 6px;font-size:12px;font-weight:800}.status-row input:checked+.status-btn{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
@media(max-width:560px){.status-row{grid-template-columns:repeat(2,1fr)}}
</style>
</head><body>
<div class="ios-bg" aria-hidden="true"><div class="mesh-orb orb-1"></div><div class="mesh-orb orb-2"></div></div>
<header class="ios-navbar wrap ios-glass"><a class="back-btn" href="siswa.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>Beranda</a><div class="nav-tools"><div class="theme-segmented"><select data-theme-select aria-label="Mode Tampilan"><option value="light">Light</option><option value="dark">Dark</option><option value="system">Sistem</option></select></div><button class="ios-btn danger" data-logout type="button">Keluar</button></div></header>
<main class="wrap"><section class="hero" style="padding-top:8px"><div class="ios-kicker"><span class="kicker-dot"></span><span>Absensi Mapel</span></div><h1 style="font-size:clamp(26px,5vw,38px)" id="pageTitle">Absensi Mata Pelajaran</h1><p>Isi kehadiran pada sesi yang sedang dibuka oleh guru.</p></section>
<section class="section" style="padding-top:0"><div class="ios-panel ios-glass"><div class="account-name-card"><span class="account-name-avatar"></span><span><small>Login sebagai</small><b id="studentName">Memuat...</b></span></div><div id="sessionList" style="margin-top:16px"><div class="empty">Memuat sesi absensi...</div></div><div id="toast" class="toast"></div></div></section></main>
<nav class="ios-tab-bar" style="--tabs:6"><a href="siswa.html">Utama</a><a href="siswa-absensi.html">Absen</a><a href="siswa-tugas.html">Tugas</a><a href="siswa-materi.html">Materi</a><a href="siswa-jadwal.html">Jadwal</a><a href="siswa-galeri.html">Galeri</a></nav><footer class="page-footer">XII TKJ 3 • SMK NU Bandar</footer>
<script src="assets/js/ios-core.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import{getFirestore,collection,query,where,getDocs,addDoc}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAv8Jm4XzYPh7xU-Pcy6QmAtbKiVLvuTnw",authDomain:"absensi-xii-tkj3.firebaseapp.com",projectId:"absensi-xii-tkj3",storageBucket:"absensi-xii-tkj3.firebasestorage.app",messagingSenderId:"219267949077",appId:"1:219267949077:web:8cf7d62f31ae1987a6641c"};const db=getFirestore(initializeApp(firebaseConfig));const q=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const params=new URLSearchParams(location.search);const mapel=params.get('mapel')||'';const raw=sessionStorage.getItem('tkj3_session');const session=raw?JSON.parse(raw):{};const student=session.nama||session.username||'Siswa';q('studentName').textContent=student;if(mapel)q('pageTitle').textContent='Absensi • '+mapel;
async function load(){if(!mapel){q('sessionList').innerHTML='<div class="empty">Mata pelajaran belum dipilih.</div>';return}try{const snap=await getDocs(query(collection(db,'absensi_pelajaran'),where('mapel','==',mapel),where('status','==','open')));const now=Date.now();const sessions=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>(x.tutupAt||0)>now).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));if(!sessions.length){q('sessionList').innerHTML='<div class="empty">Belum ada sesi absensi yang dibuka guru untuk mapel ini.</div>';return}q('sessionList').innerHTML=sessions.map(x=>`<article class="session-card open"><div class="session-head"><div><div class="session-title">${esc(x.mapel)}</div><div class="session-meta">Guru: ${esc(x.guru||'-')} • ${esc(x.tanggal||'-')} • Tutup ${x.tutupAt?new Date(x.tutupAt).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'-'}</div></div><span class="ios-pill">Dibuka</span></div><div class="status-row"><label><input type="radio" name="st-${x.id}" value="HADIR" checked><span class="status-btn">Hadir</span></label><label><input type="radio" name="st-${x.id}" value="IZIN"><span class="status-btn">Izin</span></label><label><input type="radio" name="st-${x.id}" value="SAKIT"><span class="status-btn">Sakit</span></label><label><input type="radio" name="st-${x.id}" value="ALPA"><span class="status-btn">Alpa</span></label></div><button class="ios-btn primary" style="width:100%;justify-content:center;margin-top:12px" data-submit="${x.id}">Kirim Kehadiran</button></article>`).join('');q('sessionList').querySelectorAll('[data-submit]').forEach(btn=>btn.onclick=()=>submit(btn.dataset.submit));}catch(e){console.error(e);q('sessionList').innerHTML='<div class="empty">Gagal memuat sesi. Cek Firestore Rules.</div>'}}
async function submit(id){const btn=document.querySelector(`[data-submit="${CSS.escape(id)}"]`);const status=document.querySelector(`input[name="st-${CSS.escape(id)}"]:checked`)?.value||'HADIR';const toast=q('toast');if(!student){toast.textContent='Nama siswa belum tersedia.';toast.className='toast err';return}btn.disabled=true;btn.textContent='Mengirim...';try{const existing=await getDocs(query(collection(db,'kehadiran_pelajaran'),where('sessionId','==',id),where('username','==',session.username||student)));if(!existing.empty){toast.textContent='Kamu sudah mengisi absensi pada sesi ini.';toast.className='toast err';return}await addDoc(collection(db,'kehadiran_pelajaran'),{sessionId:id,mapel,guruUid:'',nama:student,username:session.username||student,status,tanggal:new Date().toISOString().slice(0,10),waktu:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),timestamp:Date.now()});toast.textContent='Kehadiran berhasil dikirim untuk '+mapel+'.';toast.className='toast';btn.textContent='Sudah Absen';}catch(e){console.error(e);toast.textContent='Gagal mengirim: '+(e.message||e);toast.className='toast err';btn.disabled=false;btn.textContent='Kirim Kehadiran'}}
load();
</script></body></html>

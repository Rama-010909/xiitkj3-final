<style>
.session-card{padding:18px;border-radius:22px;margin-bottom:12px}.session-card.open{border:1px solid color-mix(in srgb,var(--accent) 28%,var(--card-border));}.session-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.session-title{font-size:17px;font-weight:900}.session-meta{font-size:12px;color:var(--muted-dark);margin-top:6px}.status-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.status-row label{cursor:pointer}.status-row input{position:absolute;opacity:0}.status-btn{display:block;text-align:center;border:1px solid var(--card-border);border-radius:13px;padding:10px 6px;font-size:12px;font-weight:800}.status-row input:checked+.status-btn{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
@media(max-width:560px){.status-row{grid-template-columns:repeat(2,1fr)}}

<main class="wrap"><section class="hero" style="padding-top:8px"><div class="ios-kicker"><span class="kicker-dot"></span><span>Absensi Mapel</span></div><h1 style="font-size:clamp(26px,5vw,38px)" id="pageTitle">Absensi Mata Pelajaran</h1><p>Isi kehadiran pada sesi yang sedang dibuka oleh guru.</p></section>
<section class="section" style="padding-top:0"><div class="ios-panel ios-glass"><div class="account-name-card"><span class="account-name-avatar"></span><span><small>Login sebagai</small><b id="studentName">Memuat...</b></span></div><div id="sessionList" style="margin-top:16px"><div class="empty">Memuat sesi absensi...</div></div><div id="toast" class="toast"></div></div></section></main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import{getFirestore,collection,query,where,getDocs,addDoc}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAv8Jm4XzYPh7xU-Pcy6QmAtbKiVLvuTnw",authDomain:"absensi-xii-tkj3.firebaseapp.com",projectId:"absensi-xii-tkj3",storageBucket:"absensi-xii-tkj3.firebasestorage.app",messagingSenderId:"219267949077",appId:"1:219267949077:web:8cf7d62f31ae1987a6641c"};const db=getFirestore(initializeApp(firebaseConfig));const q=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const params=new URLSearchParams(location.search);const requestedMapel=params.get('mapel')||'';const raw=sessionStorage.getItem('tkj3_session');const session=raw?JSON.parse(raw):{};const student=session.nama||session.username||'Siswa';q('studentName').textContent=student;let current=null,scheduleEntries=[];const dayNames=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];function parseTime(v){const m=String(v||'').trim().match(/(\d{1,2})\s*[.:]\s*(\d{2})/);return m?Number(m[1])*60+Number(m[2]):null}function parseRange(v){const m=String(v||'').match(/(\d{1,2}\s*[.:]\s*\d{2})\s*[-–—]\s*(\d{1,2}\s*[.:]\s*\d{2})/);if(!m)return null;const start=parseTime(m[1]),end=parseTime(m[2]);return start!==null&&end!==null&&end>start?{start,end}:null}function normalize(v){return String(v?.mapel??v?.mataPelajaran??v?.pelajaran??v?.subject??'').trim()}function isBreak(v){return /istirahat|break/i.test(normalize(v))}function todayEntries(){const day=dayNames[new Date().getDay()];return scheduleEntries.filter(v=>String(v.hari||'').toLowerCase()===day.toLowerCase())}function getCurrent(){const minute=new Date().getHours()*60+new Date().getMinutes();const rows=todayEntries().map(v=>({...v,range:parseRange(v.jam)})).filter(v=>v.range).sort((a,b)=>a.range.start-b.range.start);return rows.find(v=>minute>=v.range.start&&minute<v.range.end&&!isBreak(v))||null}async function loadSchedule(){try{const snap=await getDocs(collection(db,'jadwal'));const day=dayNames[new Date().getDay()];scheduleEntries=[];snap.forEach(ds=>{const x=ds.data()||{};const d=String(x.hari||ds.id||'');if(d.toLowerCase()!==day.toLowerCase())return;const entries=Array.isArray(x.entries)?x.entries:(Array.isArray(x.jadwal)?x.jadwal:(x.mapel?[x]:[]));entries.forEach(v=>scheduleEntries.push({...v,hari:day}))});if(requestedMapel)q('pageTitle').textContent='Absensi • '+requestedMapel;refresh();}catch(e){console.error(e);q('sessionList').innerHTML='<div class="empty">Jadwal belum dapat dimuat dari Firestore.</div>'}}function refresh(){current=getCurrent();const target=requestedMapel||current?.mapel||current?.mataPelajaran||'';if(!current){q('sessionList').innerHTML='<div class="empty">Saat ini tidak ada jam pelajaran yang berlangsung. Absensi mapel otomatis ditutup.</div>';return}const mapel=normalize(current);if(requestedMapel&&mapel.toLowerCase()!==requestedMapel.toLowerCase()){q('sessionList').innerHTML='<div class="empty">Mapel yang dipilih belum masuk jam pelajaran saat ini. Absensi mengikuti jadwal secara otomatis.</div>';return}q('sessionList').innerHTML=`<article class="session-card open"><div class="session-head"><div><div class="session-title">${esc(mapel)}</div><div class="session-meta">Jadwal: ${esc(current.jam||'-')} • Absensi aktif otomatis selama jam pelajaran</div></div><span class="ios-pill">Sedang Berlangsung</span></div><div class="status-row"><label><input type="radio" name="status" value="HADIR" checked><span class="status-btn">Hadir</span></label><label><input type="radio" name="status" value="IZIN"><span class="status-btn">Izin</span></label><label><input type="radio" name="status" value="SAKIT"><span class="status-btn">Sakit</span></label><label><input type="radio" name="status" value="ALPA"><span class="status-btn">Alpa</span></label></div><button class="ios-btn primary" style="width:100%;justify-content:center;margin-top:12px" id="submitCurrent">Kirim Kehadiran</button></article>`;q('submitCurrent').onclick=submit}async function submit(){const btn=q('submitCurrent'),toast=q('toast');if(!current){toast.textContent='Jam pelajaran sudah tidak berlangsung.';toast.className='toast err';refresh();return}const now=new Date(),minute=now.getHours()*60+now.getMinutes(),range=parseRange(current.jam),mapel=normalize(current);if(!range||minute<range.start||minute>=range.end||isBreak(current)){toast.textContent='Absensi mapel ditutup karena di luar jam pada jadwal.';toast.className='toast err';refresh();return}const status=document.querySelector('input[name="status"]:checked')?.value||'HADIR';const date=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');const sessionId='jadwal_'+date+'_'+mapel.replace(/[^a-z0-9]+/gi,'_')+'_'+range.start+'_'+range.end;btn.disabled=true;btn.textContent='Mengirim...';try{await setDoc(doc(db,'absensi_pelajaran',sessionId),{mapel,guruUid:'',guru:'Otomatis dari Jadwal',tanggal:date,dibukaAt:Date.now()-1,tutupAt:new Date(now.getFullYear(),now.getMonth(),now.getDate(),Math.floor(range.end/60),range.end%60,0,0).getTime(),status:'open',createdAt:Date.now(),sumber:'jadwal'},{merge:true});const existing=await getDocs(query(collection(db,'kehadiran_pelajaran'),where('sessionId','==',sessionId),where('username','==',session.username||student)));if(!existing.empty){toast.textContent='Kamu sudah mengisi absensi pada jam pelajaran ini.';toast.className='toast err';btn.disabled=false;btn.textContent='Sudah Absen';return}await addDoc(collection(db,'kehadiran_pelajaran'),{sessionId,mapel,guruUid:'',nama:student,username:session.username||student,status,tanggal:date,waktu:now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),timestamp:Date.now(),sumber:'jadwal'});toast.textContent='Kehadiran berhasil dikirim untuk '+mapel+'.';toast.className='toast';btn.textContent='Sudah Absen';}catch(e){console.error(e);toast.textContent='Gagal mengirim: '+(e.message||e);toast.className='toast err';btn.disabled=false;btn.textContent='Kirim Kehadiran'}}loadSchedule();setInterval(refresh,30000);
</script></body></html>

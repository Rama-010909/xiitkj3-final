<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f2f5f9"><title>Absensi Mapel • XII TKJ 3</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="assets/css/ios-core.css"><script src="auth-guard.js"></script>
<style>
.current-box{padding:16px 18px;border-radius:20px;margin-bottom:12px}.current-box b{display:block;font-size:19px;margin-top:4px}.current-box small{color:var(--muted-dark)}
.status-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.status-row label{cursor:pointer}.status-row input{position:absolute;opacity:0}.status-btn{display:block;text-align:center;border:1px solid var(--card-border);border-radius:13px;padding:10px 6px;font-size:12px;font-weight:800}.status-row input:checked+.status-btn{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.att-info{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.att-note{font-size:12px;color:var(--muted-dark)}
@media(max-width:560px){.status-row{grid-template-columns:repeat(2,1fr)}}
</style>
</head><body>
<div class="ios-bg" aria-hidden="true"><div class="mesh-orb orb-1"></div><div class="mesh-orb orb-2"></div></div>
<header class="ios-navbar wrap ios-glass"><a class="back-btn" href="siswa.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>Beranda</a><div class="nav-tools"><div class="theme-segmented"><select data-theme-select aria-label="Mode Tampilan"><option value="light">Light</option><option value="dark">Dark</option><option value="system">Sistem</option></select></div><button class="ios-btn danger" data-logout type="button">Keluar</button></div></header>
<main class="wrap"><section class="hero" style="padding-top:8px"><div class="ios-kicker"><span class="kicker-dot"></span><span>Absensi Mapel</span></div><h1 style="font-size:clamp(26px,5vw,38px)">Absensi Mata Pelajaran</h1><p>Absensi otomatis mengikuti jadwal. Saat istirahat atau di luar jam pelajaran, tombol absensi ditutup.</p></section>
<section class="section" style="padding-top:0"><div class="ios-panel ios-glass"><div class="account-name-card"><span class="account-name-avatar"></span><span><small>Login sebagai</small><b id="studentName">Memuat...</b></span></div><div id="currentLesson" class="current-box ios-glass" style="margin-top:14px"><small>Jadwal saat ini</small><b>Memeriksa...</b></div><div id="sessionList"><div class="empty">Memuat absensi...</div></div><div id="toast" class="toast"></div></div></section></main>
<nav class="ios-tab-bar" style="--tabs:6"><a href="siswa.html">Utama</a><a href="siswa-absensi.html">Absen</a><a href="siswa-tugas.html">Tugas</a><a href="siswa-materi.html">Materi</a><a href="siswa-jadwal.html">Jadwal</a><a href="siswa-galeri.html">Galeri</a></nav><footer class="page-footer">XII TKJ 3 • SMK NU Bandar</footer>
<script src="assets/js/ios-core.js"></script><script src="assets/js/schedule-utils.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import{getFirestore,collection,getDocs,query,where,addDoc}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAv8Jm4XzYPh7xU-Pcy6QmAtbKiVLvuTnw",authDomain:"absensi-xii-tkj3.firebaseapp.com",projectId:"absensi-xii-tkj3",storageBucket:"absensi-xii-tkj3.firebasestorage.app",messagingSenderId:"219267949077",appId:"1:219267949077:web:8cf7d62f31ae1987a6641c"};
const db=getFirestore(initializeApp(firebaseConfig));const q=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const raw=sessionStorage.getItem('tkj3_session');const session=raw?JSON.parse(raw):{};const student=session.nama||session.username||'Siswa';const username=String(session.username||student).trim().toLowerCase();q('studentName').textContent=student;
function localDate(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
async function getTodayEntries(){const snap=await getDocs(collection(db,'jadwal'));const today=TKJ3Schedule.dayName();for(const ds of snap.docs){const x=TKJ3Schedule.entriesFromDoc(ds);if(x.day===today)return x.entries}return []}
let current=null;
async function refresh(){try{const entries=await getTodayEntries();current=TKJ3Schedule.currentEntry(entries);const box=q('currentLesson');if(current&&current.break){box.innerHTML=`<small>${TKJ3Schedule.dayName()} • ${current.jam}</small><b>Istirahat</b><span class="att-note">Absensi mapel ditutup selama istirahat.</span>`;q('sessionList').innerHTML='<div class="empty">Belum waktunya absen mapel. Tunggu sampai pelajaran berikutnya dimulai.</div>';return}if(!current){box.innerHTML=`<small>${TKJ3Schedule.dayName()}</small><b>Tidak ada pelajaran yang sedang berlangsung</b><span class="att-note">Absensi mapel hanya dibuka saat jam pelajaran.</span>`;q('sessionList').innerHTML='<div class="empty">Saat ini tidak ada absensi mapel yang dibuka.</div>';return}box.innerHTML=`<small>${TKJ3Schedule.dayName()} • ${current.jam}</small><b>${esc(current.mapel)}</b><span class="att-note">Pelajaran sedang berlangsung • absensi dibuka otomatis</span>`;renderForm()}catch(e){console.error(e);q('sessionList').innerHTML='<div class="empty">Gagal membaca jadwal. Coba lagi.</div>'}}
async function renderForm(){const date=localDate();let already=false;try{const snap=await getDocs(query(collection(db,'kehadiran_pelajaran'),where('mapel','==',current.mapel)));already=!snap.empty}catch(e){console.warn(e)}const key='mapel-'+date+'-'+current.mapel.replace(/[^a-z0-9]+/gi,'-');q('sessionList').innerHTML=`<article class="item-card" style="padding:16px"><div class="att-info"><div><b style="font-size:15px">${esc(current.mapel)}</b><div class="att-note">Jam ${esc(current.jam)} • ${esc(date)}</div></div><span class="ios-pill">${already?'Sudah Absen':'Sedang Berlangsung'}</span></div>${already?'<div class="empty" style="margin-top:12px;padding:12px">Kamu sudah mengisi absensi untuk mapel ini pada jam pelajaran sekarang.</div>':`<div class="status-row"><label><input type="radio" name="mapelStatus" value="HADIR" checked><span class="status-btn">Hadir</span></label><label><input type="radio" name="mapelStatus" value="IZIN"><span class="status-btn">Izin</span></label><label><input type="radio" name="mapelStatus" value="SAKIT"><span class="status-btn">Sakit</span></label><label><input type="radio" name="mapelStatus" value="ALPA"><span class="status-btn">Alpa</span></label></div><button id="submitMapel" class="ios-btn primary" style="width:100%;justify-content:center;margin-top:12px" type="button">Kirim Kehadiran</button>`}</article>`;if(!already)q('submitMapel').onclick=()=>submit(key)}
async function submit(sessionKey){const btn=q('submitMapel'),toast=q('toast');if(!current||current.break){toast.textContent='Absensi sudah ditutup karena jam pelajaran berubah.';toast.className='toast err';return}const status=document.querySelector('input[name="mapelStatus"]:checked')?.value||'HADIR';btn.disabled=true;btn.textContent='Mengirim...';const date=localDate();try{const existing=await getDocs(query(collection(db,'kehadiran_pelajaran'),where('mapel','==',current.mapel)));if(!existing.empty){toast.textContent='Kamu sudah mengisi absensi untuk mapel ini.';toast.className='toast err';await renderForm();return}await addDoc(collection(db,'kehadiran_pelajaran'),{sessionId:sessionKey,mapel:current.mapel,jam:current.jam,nama:student,username,status,tanggal:date,waktu:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),timestamp:Date.now()});toast.textContent=`Kehadiran ${current.mapel} berhasil dikirim.`;toast.className='toast';await renderForm();}catch(e){console.error(e);toast.textContent='Gagal mengirim: '+(e.message||e);toast.className='toast err';btn.disabled=false;btn.textContent='Kirim Kehadiran'}}
refresh();setInterval(refresh,30000);
</script></body></html>

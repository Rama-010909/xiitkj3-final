<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="XII TKJ 3">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f2f5f9">
<title>Nilai • Ruang Siswa</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="assets/css/ios-core.css">
<script src="auth-guard.js"></script>
</head>
<body>
<div class="ios-bg" aria-hidden="true"><div class="mesh-orb orb-1"></div><div class="mesh-orb orb-2"></div></div>

<header class="ios-navbar wrap ios-glass">
  <a class="back-btn" href="siswa.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>Beranda</a>
  <div class="nav-tools">
    <div class="theme-segmented"><select data-theme-select aria-label="Mode Tampilan"><option value="light">Light</option><option value="dark">Dark</option><option value="system">Sistem</option></select></div>
    <button class="ios-btn danger" data-logout type="button">Keluar</button>
  </div>
</header>

<main class="wrap">
  <section class="hero" style="padding-top:8px">
    <div class="ios-kicker"><span class="kicker-dot"></span><span>Hasil Belajar</span></div>
    <h1 style="font-size:clamp(26px,5vw,38px)">Rekap Nilai Siswa</h1>
    <p>Nilai tugas dan penilaian yang telah dipublikasikan oleh guru.</p>
  </section>
  <section class="section" style="padding-top:0">
    <div class="ios-panel ios-glass">
      <div class="form-grid" style="margin-bottom:16px">
        <div class="field-group"><label>Mata Pelajaran</label><select id="gradeMapel" class="form-select"><option value="all">Semua mata pelajaran</option></select></div>
        <div class="field-group"><label>Tugas / Materi</label><select id="gradeSelect" class="form-select"><option value="all">Semua tugas / materi</option></select></div>
      </div>
      <div id="gradeList" class="three-col"><div class="empty">Memuat data nilai...</div></div>
    </div>
  </section>
</main>

<nav class="ios-tab-bar" style="--tabs:6" aria-label="Navigasi Mobile Siswa">
  <a href="siswa.html">Utama</a>
  <a href="siswa-absensi.html">Absen</a>
  <a href="siswa-tugas.html">Tugas</a>
  <a href="siswa-materi.html">Materi</a>
  <a href="siswa-jadwal.html">Jadwal</a>
  <a href="siswa-galeri.html">Galeri</a>
</nav>
<footer class="page-footer">XII TKJ 3 • SMK NU Bandar</footer>

<script src="assets/js/ios-core.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {getFirestore,collection,onSnapshot} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAv8Jm4XzYPh7xU-Pcy6QmAtbKiVLvuTnw",authDomain:"absensi-xii-tkj3.firebaseapp.com",projectId:"absensi-xii-tkj3",storageBucket:"absensi-xii-tkj3.firebasestorage.app",messagingSenderId:"219267949077",appId:"1:219267949077:web:8cf7d62f31ae1987a6641c"};
const db=getFirestore(initializeApp(firebaseConfig));
const q=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const raw=sessionStorage.getItem('tkj3_session'),session=raw?JSON.parse(raw):{},studentName=session.nama||'',studentUsername=session.username||session.uid||'';
let grades=[];
function mine(x){
  const n=String(x.nama??'').trim().toLowerCase(),u=String(x.username??'').trim().toLowerCase();
  return (!studentName&&!studentUsername) || n===studentName.trim().toLowerCase() || (!!studentUsername&&u===studentUsername.trim().toLowerCase());
}
function render(){
  const mapel=q('gradeMapel'),sel=q('gradeSelect'),box=q('gradeList');
  const mineGrades=grades.filter(mine);
  if(!mineGrades.length){mapel.innerHTML='<option value="all">Belum ada nilai</option>';sel.innerHTML='<option value="all">Belum ada nilai</option>';box.innerHTML='<div class="empty">Belum ada nilai untuk akun ini.</div>';return;}
  const mapels=[...new Set(mineGrades.map(x=>String(x.mapel||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'id'));
  const oldMap=mapel.value||'all';
  mapel.innerHTML='<option value="all">Semua mata pelajaran</option>'+mapels.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');
  mapel.value=mapels.includes(oldMap)?oldMap:'all';
  const byMap=mapel.value==='all'?mineGrades:mineGrades.filter(x=>String(x.mapel||'')===mapel.value);
  const items=[...new Map(byMap.map(x=>{const key=(x.referensiTipe||'Penilaian')+'|'+(x.referensiId||x.judul||x.id);return [key,x]})).values()];
  const oldSel=sel.value||'all';
  sel.innerHTML='<option value="all">Semua tugas / materi</option>'+items.map(x=>{const key=(x.referensiTipe||'Penilaian')+'|'+(x.referensiId||x.judul||'');return `<option value="${esc(key)}">${esc(x.referensiTipe||'Penilaian')} — ${esc(x.judul||'Penilaian')}</option>`}).join('');
  sel.value=[...sel.options].some(o=>o.value===oldSel)?oldSel:'all';
  const chosen=sel.value;
  const shown=chosen==='all'?byMap:byMap.filter(x=>(x.referensiTipe||'Penilaian')+'|'+(x.referensiId||x.judul||x.id)===chosen);
  box.innerHTML=shown.length?shown.map(x=>`<div class="item-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span class="ios-pill">${esc(x.mapel||'Mapel')}</span><strong style="font-size:22px;color:var(--accent)">${esc(x.nilai)}</strong></div><h4 style="margin:8px 0 2px;font-size:15px">${esc(x.judul||'Penilaian')}</h4><small>${esc(x.referensiTipe||'Penilaian')}${x.guru?' • '+esc(x.guru):''}</small></div>`).join(''):'<div class="empty">Belum ada nilai untuk pilihan tersebut.</div>';
}
onSnapshot(collection(db,'nilai'),snap=>{grades=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>Number(b.updatedAt||b.createdAt||0)-Number(a.updatedAt||a.createdAt||0));render()},e=>{q('gradeList').innerHTML='<div class="empty">Gagal memuat nilai: '+esc(e?.message||e)+'</div>'});
q('gradeMapel').onchange=()=>{q('gradeSelect').value='all';render()};q('gradeSelect').onchange=render;
</script>
</body>
</html>

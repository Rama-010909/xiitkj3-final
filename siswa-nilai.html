<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f2f5f9">
<title>Nilai • Ruang Siswa</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="assets/css/ios-core.css">
<script src="auth-guard.js"></script>
</head>
<body>
<div class="ios-bg" aria-hidden="true"><div class="mesh-orb orb-1"></div><div class="mesh-orb orb-2"></div></div>

<header class="ios-navbar wrap ios-glass">
  <a class="back-btn" href="siswa.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>Beranda</a>
  <div class="nav-tools">
    <div class="theme-segmented"><select data-theme-select aria-label="Mode Tampilan"><option value="light">Light</option><option value="dark">Dark</option><option value="system">Sistem</option></select></div>
    <button class="ios-btn danger" data-logout type="button">Keluar</button>
  </div>
</header>

<main class="wrap">
  <section class="hero" style="padding-top:8px">
    <div class="ios-kicker"><span class="kicker-dot"></span><span>Hasil Belajar</span></div>
    <h1 style="font-size:clamp(26px,5vw,38px)">Rekap Nilai Siswa</h1>
    <p>Nilai tugas dan penilaian yang telah dipublikasikan oleh guru.</p>
  </section>
  <section class="section" style="padding-top:0">
    <div class="ios-panel ios-glass"><div id="gradeList" class="three-col"><div class="empty">Memuat data nilai...</div></div></div>
  </section>
</main>

<nav class="ios-tab-bar" style="--tabs:6" aria-label="Navigasi Mobile Siswa">
  <a href="siswa.html">Utama</a>
  <a href="siswa-absensi.html">Absen</a>

  <a href="siswa-galeri.html">Galeri</a>
</nav>
<footer class="page-footer">XII TKJ 3 • SMK NU Bandar</footer>

<script src="assets/js/ios-core.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAv8Jm4XzYPh7xU-Pcy6QmAtbKiVLvuTnw", authDomain: "absensi-xii-tkj3.firebaseapp.com", projectId: "absensi-xii-tkj3", storageBucket: "absensi-xii-tkj3.firebasestorage.app", messagingSenderId: "219267949077", appId: "1:219267949077:web:8cf7d62f31ae1987a6641c" };
const db = getFirestore(initializeApp(firebaseConfig));
const q = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

onSnapshot(query(collection(db, "nilai"), orderBy("createdAt", "desc")), snap => {
  const box = q('gradeList');
  if (snap.empty) { box.innerHTML = '<div class="empty">Belum ada data nilai yang dipublikasikan.</div>'; return; }
  box.innerHTML = snap.docs.map(d => {
    const x = d.data();
    return `<div class="item-card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="ios-pill">${esc(x.mapel || 'Mapel')}</span>
        <strong style="font-size:22px;color:var(--accent);font-weight:850">${esc(x.nilai)}</strong>
      </div>
      <h4 style="margin:8px 0 2px;font-size:15px;font-weight:750">${esc(x.nama)}</h4>
      <small style="color:var(--muted-dark)">${esc(x.judul || 'Penilaian')}</small>
    </div>`;
  }).join('');
});
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
</script>
</body>
</html>

<script src="assets/js/ios-core.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAv8Jm4XzYPh7xU-Pcy6QmAtbKiVLvuTnw", authDomain: "absensi-xii-tkj3.firebaseapp.com", projectId: "absensi-xii-tkj3", storageBucket: "absensi-xii-tkj3.firebasestorage.app", messagingSenderId: "219267949077", appId: "1:219267949077:web:8cf7d62f31ae1987a6641c" };
const db = getFirestore(initializeApp(firebaseConfig));
const q = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

const structureDefaults = [
  { id: "wali", role: "Wali Kelas", name: "Andi Prasetyo, S.Kom." },
  { id: "ketua", role: "Ketua Kelas", name: "Virnaji Rizky Ramadhan" },
  { id: "wakil", role: "Wakil Ketua", name: "Alvin" },
  { id: "sekretaris", role: "Sekretaris", name: "Anggun Khoiru Syifa" },
  { id: "bendahara", role: "Bendahara", name: "Suci Listiana" }
];
onSnapshot(collection(db, "struktur"), snap => {
  const container = q('structureContainer');
  let data = structureDefaults.slice();
  if (!snap.empty) {
    const map = new Map(snap.docs.map(d => [d.id, d.data()]));
    data = structureDefaults.map(def => ({ ...def, ...(map.get(def.id) || {}) }));
  }
  container.innerHTML = data.map(s => `
    <div class="structure-card ios-glass">
      <div class="structure-avatar">${esc((s.name || '?').charAt(0).toUpperCase())}</div>
      <div><span class="ios-pill" style="font-size:10.5px">${esc(s.role)}</span><h4 style="margin:4px 0 0;font-size:15px;font-weight:750;color:var(--text-h)">${esc(s.name)}</h4><small style="color:var(--muted-dark)">Pengurus XII TKJ 3</small></div>
    </div>
  `).join('');
});
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
</script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="XII TKJ 3">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f2f5f9">
<title>Nilai • Ruang Guru</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="assets/css/ios-core.css">

</head>
<body>
<div class="ios-bg" aria-hidden="true"><div class="mesh-orb orb-1"></div><div class="mesh-orb orb-2"></div></div>

<header class="ios-navbar wrap ios-glass">
  <a class="back-btn" href="guru.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>Beranda</a>
  <div class="nav-tools">
    <div class="theme-segmented"><select data-theme-select aria-label="Mode Tampilan"><option value="light">Light</option><option value="dark">Dark</option><option value="system">Sistem</option></select></div>
    <button class="ios-btn danger" data-logout type="button">Keluar</button>
  </div>
</header>

<main class="wrap">
  <section class="hero" style="padding-top:8px">
    <div class="ios-kicker"><span class="kicker-dot"></span><span>Nilai</span></div>
    <h1 style="font-size:clamp(26px,5vw,38px)">Input Nilai Siswa</h1>
    <p>Publikasikan nilai untuk mata pelajaran yang sedang dipilih.</p>
  </section>

  <section class="section" style="padding-top:0">
    <div id="subjects" class="subject-row"><div class="empty">Memuat mata pelajaran...</div></div>
    <div class="two-col" style="margin-top:6px">
      <div class="ios-panel ios-glass">
        <h3 style="margin:0 0 12px;font-size:16px;font-weight:800">Nilai Baru</h3>
        <div class="form-grid">
          <div class="field-group"><label>Nama siswa</label><select id="gradeStudent" class="form-select"></select></div>
          <div class="field-group"><label>Tugas / Materi yang dinilai</label><select id="gradeSource" class="form-select"><option value="">Pilih tugas atau materi...</option></select></div>
          <div class="two-col">
            <div class="field-group"><label>Nilai</label><input id="gradeValue" type="number" min="0" max="100" class="form-input"></div>
            <div class="field-group"><label>Judul penilaian</label><input id="gradeTitle" class="form-input" placeholder="Tugas 1"></div>
          </div>
          <button class="ios-btn primary" id="saveGrade" type="button" style="padding:14px;justify-content:center">Simpan Nilai</button>
        </div>
      </div>
      <div>
        <h3 style="margin:0 0 12px;font-size:16px;font-weight:800">Nilai Tersimpan</h3>
        <div id="gradeList" class="card-list"><div class="empty">Pilih mata pelajaran.</div></div>
      </div>
    </div>
  </section>
</main>

<nav class="ios-tab-bar" style="--tabs:6" aria-label="Navigasi Mobile Guru">
  <a href="guru.html">Utama</a>
  <a href="guru-tugas.html">Tugas</a>
  <a href="guru-pengumuman.html">Info</a>
  <a href="guru-materi.html">Materi</a>
  <a href="guru-absensi.html">Absen</a>
  <a href="guru-nilai.html">Nilai</a>
</nav>
<footer class="page-footer">XII TKJ 3 • SMK NU Bandar</footer>

<script src="assets/js/ios-core.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";import {getFirestore,collection,addDoc,onSnapshot,query,where,doc,getDoc,getDocs,deleteDoc,updateDoc} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAv8Jm4XzYPh7xU-Pcy6QmAtbKiVLvuTnw", authDomain: "absensi-xii-tkj3.firebaseapp.com", projectId: "absensi-xii-tkj3", storageBucket: "absensi-xii-tkj3.firebasestorage.app", messagingSenderId: "219267949077", appId: "1:219267949077:web:8cf7d62f31ae1987a6641c" };
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),q=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const KEY='tkj3_guru_subject',defs=["Administrasi Infrastruktur Jaringan","Administrasi Server","Teknologi Layanan Jaringan","Teknologi Jaringan Berbasis Luas (WAN)","Komputer dan Jaringan Dasar"];let uid='',teacher='',current='',unsub=null,editing='';
async function loadStudents(){const s=await getDocs(collection(db,'siswa'));q('gradeStudent').innerHTML='<option value="">Pilih siswa...</option>'+s.docs.map(d=>`<option value="${esc(d.data().nama)}">${esc(d.data().nama)}</option>`).join('')}
async function loadSources(){if(!current)return;const [ts,ms]=await Promise.all([getDocs(query(collection(db,'tugas'),where('mapel','==',current))),getDocs(query(collection(db,'materi'),where('mapel','==',current)))]);const arr=[...ts.docs.map(d=>({id:d.id,type:'Tugas',title:d.data().judul})),...ms.docs.map(d=>({id:d.id,type:'Materi',title:d.data().judul}))];q('gradeSource').innerHTML='<option value="">Pilih tugas atau materi...</option>'+arr.map(x=>`<option value="${esc(x.type+'|'+x.id)}">${esc(x.type)} — ${esc(x.title)}</option>`).join('');}
function subs(a){const st=localStorage.getItem(KEY);current=st&&a.includes(st)?st:a[0];q('subjects').innerHTML=a.map(s=>`<button type="button" class="subject-chip ${s===current?'active':''}" data-sub="${esc(s)}">${esc(s)}</button>`).join('');q('subjects').querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{current=b.dataset.sub;loadSources();loadGrades()});loadSources();loadGrades()}
function loadGrades(){if(unsub)unsub();q('gradeList').innerHTML='<div class="empty">Memuat...</div>';unsub=onSnapshot(query(collection(db,'nilai'),where('mapel','==',current)),snap=>{const ds=[...snap.docs].sort((a,b)=>Number(b.data().createdAt||0)-Number(a.data().createdAt||0));q('gradeList').innerHTML=snap.empty?'<div class="empty">Belum ada nilai.</div>':ds.map(d=>{const x=d.data();return `<article class="item-card"><div style="display:flex;justify-content:space-between"><b>${esc(x.nama)}</b><strong style="color:var(--accent);font-size:18px">${esc(x.nilai)}</strong></div><small>${esc(x.judul||'Penilaian')} • ${esc(x.referensiTipe||'')} </small><div style="margin-top:10px;display:flex;gap:8px"><button class="ios-btn" data-edit="${d.id}">Edit</button><button class="ios-btn danger" data-del="${d.id}">Hapus</button></div></article>`}).join('');q('gradeList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const d=snap.docs.find(z=>z.id===b.dataset.edit),x=d.data();editing=d.id;q('gradeStudent').value=x.nama||'';q('gradeValue').value=x.nilai??'';q('gradeTitle').value=x.judul||'';q('gradeSource').value=x.referensiTipe&&x.referensiId?x.referensiTipe+'|'+x.referensiId:'';q('saveGrade').textContent='Simpan Perubahan';window.scrollTo({top:0,behavior:'smooth'})});q('gradeList').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Hapus nilai ini?'))await deleteDoc(doc(db,'nilai',b.dataset.del))})})}
async function init(id,a){try{const u=await getDoc(doc(db,'users',id||'guru-andi'));if(u.exists()){const d=u.data();teacher=d.nama||teacher;if(Array.isArray(d.mataPelajaran)&&d.mataPelajaran.length)a=d.mataPelajaran}}catch(e){}subs(a?.length?a:defs)}try{const p=JSON.parse(sessionStorage.getItem('tkj3_session')||'null');if(p?.role==='guru'){uid=p.username||'guru-andi';teacher=p.nama||uid;init(uid,defs)}}catch(e){}onAuthStateChanged(auth,async u=>{if(u){uid=u.uid;try{const s=await getDoc(doc(db,'users',uid));if(s.exists()&&s.data().role==='guru'){const d=s.data();teacher=d.nama||u.email;init(uid,d.mataPelajaran||d.subjects||defs)}}catch(e){}}});loadStudents();q('saveGrade').onclick=async()=>{const nama=q('gradeStudent').value,nilai=q('gradeValue').value,source=q('gradeSource').value;if(!nama||nilai===''||!current){alert('Lengkapi siswa, nilai, dan tugas/materi.');return}const [referensiTipe,referensiId]=source?source.split('|'):['',''];const opt=q('gradeSource').selectedOptions[0];const judul=q('gradeTitle').value.trim()||opt?.textContent?.replace(/^Tugas — |^Materi — /,'')||'Penilaian';try{const data={nama,nilai:Number(nilai),judul,mapel:current,guruUid:uid,referensiTipe,referensiId,updatedAt:Date.now()};if(editing){await updateDoc(doc(db,'nilai',editing),data);alert('Nilai berhasil diperbarui.');editing='';q('saveGrade').textContent='Simpan Nilai'}else{await addDoc(collection(db,'nilai'),{...data,createdAt:Date.now()});alert('Nilai berhasil disimpan.')}q('gradeValue').value='';q('gradeTitle').value='';q('gradeSource').value=''}catch(e){alert('Nilai gagal disimpan: '+(e.message||e))}};
</script>
</body>
</html>

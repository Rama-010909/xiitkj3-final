<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f2f5f9">
<title>Data Guru • Admin</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="assets/css/ios-core.css">
<script src="auth-guard.js"></script>
<style>
.manager-list{display:grid;gap:10px;margin-top:14px}
.manager-row{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--card-border)}
.manager-num{font-weight:900;color:var(--accent);text-align:center}
</style>
</head>
<body>
<div class="ios-bg" aria-hidden="true"><div class="mesh-orb orb-1"></div><div class="mesh-orb orb-2"></div></div>

<header class="ios-navbar wrap ios-glass">
  <a class="back-btn" href="admin.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>Beranda</a>
  <div class="nav-tools">
    <div class="theme-segmented"><select data-theme-select aria-label="Mode Tampilan"><option value="light">Light</option><option value="dark">Dark</option><option value="system">Sistem</option></select></div>
    <button class="ios-btn danger" data-logout type="button">Keluar</button>
  </div>
</header>

<main class="wrap">
  <section class="hero" style="padding-top:8px">
    <div class="ios-kicker"><span class="kicker-dot"></span><span>Data Guru</span></div>
    <h1 style="font-size:clamp(26px,5vw,38px)">Kelola Guru</h1>
    <p>Tambah akun guru baru lengkap dengan username &amp; password untuk login di Portal, serta mata pelajaran yang diampu.</p>
  </section>

  <section class="section" style="padding-top:0">
    <div class="ios-panel ios-glass" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <div><b style="font-size:14px">Akun guru lama</b><div style="font-size:12px;color:var(--muted-dark);margin-top:3px">Hapus akun lama dengan username <b>andi</b> agar kamu bisa membuat akun guru manual yang baru.</div></div>
        <button class="ios-btn danger" id="removeLegacyAndi" type="button">Hapus akun andi</button>
      </div>
      <div id="legacyMessage" class="toast"></div>
    </div>
    <div class="ios-panel ios-glass">
      <div class="form-grid">
        <div class="two-col">
          <div class="field-group"><label>Nama guru</label><input id="teacherNameInput" class="form-input"></div>
          <div class="field-group"><label>Username login</label><input id="teacherUsernameInput" class="form-input"></div>
        </div>
        <div class="two-col">
          <div class="field-group"><label>Password login</label><input id="teacherPasswordInput" type="password" class="form-input" autocomplete="new-password"></div>
          <div class="field-group"><label>Mapel (pisahkan koma)</label><input id="teacherSubjectsInput" class="form-input"></div>
        </div>
        <div class="field-group"><label>Email (opsional)</label><input id="teacherEmailInput" class="form-input"></div>
        <button class="ios-btn primary" id="saveTeacher" type="button" style="padding:14px;justify-content:center">Tambah Akun Guru</button>
        <div id="teacherMessage" class="toast"></div>
      </div>
      <div id="teacherManagerList" class="manager-list"></div>
    </div>
  </section>
</main>

<footer class="page-footer">XII TKJ 3 • Admin</footer>

<script src="assets/js/ios-core.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, getDoc, getDocs, query, where, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAv8Jm4XzYPh7xU-Pcy6QmAtbKiVLvuTnw", authDomain: "absensi-xii-tkj3.firebaseapp.com", projectId: "absensi-xii-tkj3", storageBucket: "absensi-xii-tkj3.firebasestorage.app", messagingSenderId: "219267949077", appId: "1:219267949077:web:8cf7d62f31ae1987a6641c" };
const db = getFirestore(initializeApp(firebaseConfig));
const el = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function hashPw(pw) { const data = new TextEncoder().encode(pw); const h = await crypto.subtle.digest("SHA-256", data); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2,"0")).join(""); }

function renderTeachers(rows) {
  const box = el('teacherManagerList');
  box.innerHTML = rows.length ? rows.map(x => `<div class="manager-row"><div class="manager-num">${esc(x.nama||'?').slice(0,1)}</div><div><b>${esc(x.nama)}</b><div style="color:var(--muted-dark);font-size:12px;margin-top:2px">${esc(x.email||'')} ${x.email?'·':''} ${(x.mataPelajaran||[]).map(esc).join(', ')}</div><small style="color:var(--muted-dark)">Username: ${esc(x.id)}</small></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="ios-btn" data-edit-guru="${esc(x.id)}" style="padding:8px 12px;font-size:12px">Edit Akun</button><button type="button" class="ios-btn danger" data-del-guru="${esc(x.id)}" style="padding:8px 12px;font-size:12px">Hapus</button></div></div>`).join('') : '<div class="empty">Belum ada akun guru.</div>';
  box.querySelectorAll('[data-del-guru]').forEach(b => b.onclick = async () => { if (confirm('Hapus akun guru ini? Guru tidak akan bisa login lagi.')) { await deleteDoc(doc(db, 'users', b.dataset.delGuru)); await deleteDoc(doc(db, 'accounts', b.dataset.delGuru)).catch(()=>{}); } });
  box.querySelectorAll('[data-edit-guru]').forEach(b => b.onclick = () => editTeacherAccount(b.dataset.editGuru));
}
async function removeLegacyAndi(){
  const msg=el('legacyMessage'),btn=el('removeLegacyAndi');
  if(!confirm('Hapus akun guru lama dengan username "andi"? Tindakan ini tidak bisa dibatalkan.')) return;
  btn.disabled=true; msg.textContent='Menghapus akun andi...'; msg.className='toast';
  try{
    const snap=await getDocs(query(collection(db,'accounts'),where('username','==','andi')));
    for(const d of snap.docs) await deleteDoc(d.ref);
    await deleteDoc(doc(db,'users','andi'));
    msg.textContent=snap.empty?'Akun andi tidak ditemukan.':'Akun andi berhasil dihapus.'; msg.className='toast';
  }catch(e){console.error(e);msg.textContent='Gagal menghapus akun andi: '+(e.message||e);msg.className='toast err'}
  finally{btn.disabled=false}
}
el('removeLegacyAndi').onclick=removeLegacyAndi;

onSnapshot(collection(db, 'users'), snap => renderTeachers(snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.role === 'guru')));

el('saveTeacher')?.addEventListener('click', async () => {
  const btn = el('saveTeacher'), msg = el('teacherMessage');
  const username = el('teacherUsernameInput').value.trim().toLowerCase(), password = el('teacherPasswordInput').value, name = el('teacherNameInput').value.trim(), email = el('teacherEmailInput').value.trim(), subs = el('teacherSubjectsInput').value.split(',').map(x => x.trim()).filter(Boolean);
  if (!username || !password || !name || !subs.length) { msg.textContent = 'Nama, username, password, dan minimal satu mapel wajib diisi.'; msg.className = 'toast err'; return; }
  if (!/^[a-z0-9._-]{3,40}$/.test(username)) { msg.textContent = 'Username hanya boleh huruf kecil, angka, titik, garis bawah, atau minus (3–40 karakter).'; msg.className = 'toast err'; return; }
  if (password.length < 4) { msg.textContent = 'Password minimal 4 karakter.'; msg.className = 'toast err'; return; }
  btn.disabled = true;
  try {
    const existing = await getDoc(doc(db, 'accounts', username));
    if (existing.exists()) { msg.textContent = 'Username sudah dipakai, pilih username lain.'; msg.className = 'toast err'; return; }
    const passwordHash = await hashPw(password);
    await setDoc(doc(db, 'accounts', username), { username, passwordHash, role: 'guru', nama: name, createdAt: Date.now(), updatedAt: Date.now() }, { merge: false });
    await setDoc(doc(db, 'users', username), { role: 'guru', nama: name, email, mataPelajaran: subs, updatedAt: Date.now() }, { merge: true });
    msg.textContent = 'Akun guru dibuat. Guru bisa langsung login di Portal dengan username & password ini.'; msg.className = 'toast';
    ['teacherUsernameInput','teacherPasswordInput','teacherNameInput','teacherEmailInput','teacherSubjectsInput'].forEach(x => el(x).value = '');
  } catch (e) { console.error(e); msg.textContent = (e.code === 'permission-denied' ? 'PERMISSION DENIED: Rules Firestore belum mengizinkan accounts/users.' : ('Gagal membuat akun guru: ' + (e.message || e))); msg.className = 'toast err'; }
  finally { btn.disabled = false; }
});

async function editTeacherAccount(oldUsername) {
  const msg = el('teacherMessage');
  const uSnap = await getDoc(doc(db, 'users', oldUsername));
  const userData = uSnap.exists() ? uSnap.data() : {};
  const name = userData.nama || oldUsername;
  const newUsernameRaw = prompt(`Username baru untuk ${name} (kosongkan untuk batal):`, oldUsername);
  if (newUsernameRaw === null) return;
  const newUsername = newUsernameRaw.trim().toLowerCase();
  if (!newUsername) { msg.textContent = 'Username tidak boleh kosong.'; msg.className = 'toast err'; return; }
  const newPassword = prompt(`Password baru untuk ${name} (kosongkan agar password tidak berubah):`) || '';
  if (newPassword && newPassword.length < 4) { msg.textContent = 'Password minimal 4 karakter.'; msg.className = 'toast err'; return; }
  if (!/^[a-z0-9._-]{3,40}$/.test(newUsername)) { msg.textContent = 'Username hanya boleh huruf kecil, angka, titik, garis bawah, atau minus (3–40 karakter).'; msg.className = 'toast err'; return; }
  try {
    if (newUsername !== oldUsername) {
      const existing = await getDoc(doc(db, 'accounts', newUsername));
      if (existing.exists()) { msg.textContent = `Username "${newUsername}" sudah dipakai, pilih username lain.`; msg.className = 'toast err'; return; }
    }
    const accSnap = await getDoc(doc(db, 'accounts', oldUsername));
    const accData = accSnap.exists() ? accSnap.data() : {};
    const passwordHash = newPassword ? await hashPw(newPassword) : accData.passwordHash;
    await setDoc(doc(db, 'accounts', newUsername), { username: newUsername, passwordHash, role: 'guru', nama: name, createdAt: accData.createdAt || Date.now(), updatedAt: Date.now() });
    await setDoc(doc(db, 'users', newUsername), { role: 'guru', nama: name, email: userData.email || '', mataPelajaran: userData.mataPelajaran || [], updatedAt: Date.now() }, { merge: true });
    if (newUsername !== oldUsername) {
      await deleteDoc(doc(db, 'accounts', oldUsername));
      await deleteDoc(doc(db, 'users', oldUsername));
    }
    msg.textContent = newPassword ? `Username & password ${name} sudah diperbarui.` : `Username ${name} sudah diperbarui.`; msg.className = 'toast';
  } catch (e) { console.error(e); msg.textContent = (e.code === 'permission-denied' ? 'PERMISSION DENIED: periksa Firestore Rules untuk accounts/users.' : ('Gagal memperbarui akun guru: ' + (e.message || e))); msg.className = 'toast err'; }
}
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
</script>
</body>
</html>
